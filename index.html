    '<p class="muted small">番号は本試験の出題順（問1〜）に対応しています。出題する論点を選んでください。</p>'+
    '<div class="row"><button class="btn" data-action="chipall">すべて選ぶ</button><button class="btn" data-action="chipnone">すべて外す</button></div>'+
    '<div class="chips">'+chips+'</div>'+
    '<button class="btn primary block" data-action="drillstart" data-subject="'+subject+'"'+(total?'':' disabled')+'>ドリルを始める（'+total+'問）</button>'+
  '</div>';
}
function strikeSet(){ if(!S) return []; if(!S.strike) S.strike = {}; return S.strike[S.idx] || (S.strike[S.idx] = []); }
function statementHTML(q, i, reveal, canStrike){
  var st = q.statements[i];
  var cls = reveal ? (st.ok?' ok':' ng') : '';
  var struck = canStrike && strikeSet().indexOf(i)>=0;
  if(canStrike) cls += ' can' + (struck?' struck':'');
  return '<li class="stmt'+cls+'"'+(canStrike? ' data-action="strike" data-i="'+i+'" role="button" tabindex="0" aria-pressed="'+(struck?'true':'false')+'" title="タップで取消線（誤りと判断した記述の目印）"':'')+'><span class="kana" aria-hidden="true">'+esc(st.k)+'</span><div><div class="t">'+(reveal?'<span class="verdict">'+(st.ok?'正':'誤')+'</span>':'')+esc(st.t)+'</div>'+(reveal?'<div class="why">'+esc(st.why)+'</div>':'')+'</div></li>';
}
function optionsHTML(q, chosen, reveal, disabled){
  var hintIdx = -1;
  if(!reveal && isCombo(q) && S && strikeSet().length){
    var rest = q.statements.map(function(_,k){return k;}).filter(function(k){ return strikeSet().indexOf(k)<0; }).join(',');
    q.opts.forEach(function(o,k){ if(o.join(',')===rest) hintIdx=k; });
  }
  return '<ol class="opts">'+q.opts.map(function(o,i){
    var lab = isCombo(q) ? comboLabel(o) : o;
    var cls = 'opt'; var mark='';
    if(!reveal && hintIdx===i){ cls+=' hint'; mark='取消線の残り'; }
    if(reveal){ if(i===q.ans){ cls+=' correct'; mark='正解'; } else if(i===chosen){ cls+=' wrong'; mark='あなたの解答'; } }
    return '<li><button class="'+cls+'" data-action="choose" data-i="'+i+'" aria-pressed="'+(chosen===i?'true':'false')+'"'+(disabled?' disabled':'')+'><span class="num">('+(i+1)+')</span><span class="lab">'+esc(lab)+'</span><span class="mark">'+mark+'</span></button></li>';
  }).join('')+'</ol>';
}
function renderQuestion(){
  if(!S || !S.items.length){ return '<div class="stack"><div class="empty">出題できる問題がありません。</div><button class="btn" data-action="home">ホーム</button></div>'; }
  var i = S.idx, q = S.items[i], n = S.items.length;
  var isExam = S.mode==="exam";
  var reveal = !isExam && S.revealed[i];
  var chosen = S.ans[i];
  var head = '<div class="qbar"><span class="prog">問 '+(i+1)+' ／ '+n+'</span>'+
    (isExam ? '<span id="timer" class="timer">'+mmss(S.limit - Math.floor((Date.now()-S.start)/1000))+'</span>' : '<span class="muted small">'+(S.mode==="review"?'復習':'ドリル')+'　正解 '+S.items.filter(function(x,k){return S.revealed[k] && S.ans[k]===x.ans;}).length+'</span>')+
    '</div><div class="progress"><i style="width:'+Math.round(((i+(reveal?1:0))/n)*100)+'%"></i></div>';
  var body = '<div class="qpaper"><div class="qhead"><span class="qno">問'+zen(isExam? q.slot : i+1)+'</span><span class="tag '+SUBJ[q.subject].cls+'">'+SUBJ[q.subject].name+'</span><span class="qtopic">'+esc(topicName(S.level, q.subject, q.slot))+'</span></div>'+
    (q.case&&DATA.cases&&DATA.cases[q.case]? '<div class="given" style="margin:0 0 10px">'+esc(DATA.cases[q.case])+'</div>':'')+'<p class="stem">'+esc(q.stem)+'</p>'+
    (q.figure? '<div class="figure">'+q.figure+'</div>':'')+
    (q.given? '<div class="given">'+esc(q.given)+'</div>':'')+
    (isCombo(q)? '<ol class="stmts">'+q.statements.map(function(_,k){ return statementHTML(q,k,reveal,!reveal); }).join('')+'</ol>'+(reveal?'':'<p class="hintnote">記述をタップすると取消線が入ります（誤りと判断した目印。採点には影響しません）。</p>') : '')+
    optionsHTML(q, chosen, reveal, reveal)+
    (reveal ? '<div class="result-line '+(chosen===q.ans?'ok':'ng')+'">'+(chosen===q.ans?'正解':'不正解')+'　正答は ('+(q.ans+1)+') '+esc(isCombo(q)? comboLabel(q.opts[q.ans]) : q.opts[q.ans])+'</div>' : '')+
    (reveal && q.explain ? '<div class="explain">'+q.explain.split("\n").map(function(l){return '<div class="line">'+esc(l)+'</div>';}).join('')+'</div>' : '')+
  '</div>';
  var nav;
  if(isExam){
    var answered = S.ans.filter(function(a){return a>=0;}).length;
    nav = '<div class="nav"><button class="btn" data-action="prev"'+(i===0?' disabled':'')+'>前へ</button>'+
      (i<n-1 ? '<button class="btn" data-action="next">次へ</button>' : '<button class="btn primary" data-action="finish">採点する</button>')+'</div>'+
      '<div class="sheet" aria-label="解答状況">'+S.items.map(function(_,k){ return '<button data-action="jump" data-i="'+k+'" class="'+(S.ans[k]>=0?'answered':'')+(k===i?' current':'')+'" aria-label="問'+(k+1)+'">'+(k+1)+'</button>'; }).join('')+'</div>'+
      '<div class="nav"><span class="muted small">解答済み '+answered+'／'+n+'</span><span class="row"><button class="btn ghost" data-action="abort">中断</button><button class="btn" data-action="finish">採点する</button></span></div>';
  } else {
    nav = '<div class="nav"><button class="btn ghost" data-action="abort">やめる</button>'+(reveal ? (i<n-1 ? '<button class="btn primary" data-action="next">次へ</button>' : '<button class="btn primary" data-action="drilldone">結果を見る</button>') : '<span class="muted small">選択肢を選ぶと正誤と解説が表示されます</span>')+'</div>';
  }
  return head+body+nav;
}
function renderResult(){
  var n=S.items.length, ok=S.score, pass = ok>=Math.ceil(n*PASS);
  var list = S.items.map(function(q,i){
    var c = S.ans[i]===q.ans;
    return '<li class="ritem"><button data-action="toggle" data-i="'+i+'" aria-expanded="false"><span class="mk '+(c?'ok':'ng')+'">'+(c?'○':'×')+'</span><span>問'+q.slot+'　'+esc(topicName(S.level,q.subject,q.slot))+'</span><span class="an">'+(S.ans[i]>=0? '('+(S.ans[i]+1)+')':'未解答')+' → ('+(q.ans+1)+')</span><span class="caret">›</span></button><div class="detail" id="d'+i+'" hidden></div></li>';
  }).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>採点結果　<span class="tag '+SUBJ[S.subject].cls+'">'+SUBJ[S.subject].name+'</span></h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card stamp-wrap"><div class="stamp'+(pass?' pass':'')+'">'+(pass?'合格':'不合格')+'</div><div><div class="score">'+ok+'<small>／'+n+'問　'+Math.round(ok/n*100)+'%</small></div><p class="muted small">合格基準 60%（'+Math.ceil(n*PASS)+'問以上）　所要 '+mmss(S.elapsed)+(S.auto?'　時間切れで自動採点':'')+'</p></div></div>'+
    '<div class="card"><h2>問題ごとの結果</h2><p class="muted small">行を押すと記述の正誤と解説を表示します。</p><ul class="rlist">'+list+'</ul></div>'+
    '<div class="row"><button class="btn primary" data-action="exam" data-subject="'+S.subject+'">同じ科目でもう一度</button><button class="btn" data-action="review"'+(reviewPool(S.level).length?'':' disabled')+'>間違えた問題を復習</button></div>'+
  '</div>';
}
function detailHTML(q, chosen){
  return '<div class="qpaper">'+(q.case&&DATA.cases&&DATA.cases[q.case]? '<div class="given" style="margin:0 0 10px">'+esc(DATA.cases[q.case])+'</div>':'')+'<p class="stem small">'+esc(q.stem)+'</p>'+(q.figure? '<div class="figure">'+q.figure+'</div>':'')+(q.given? '<div class="given">'+esc(q.given)+'</div>':'')+
    (isCombo(q)? '<ol class="stmts">'+q.statements.map(function(_,k){ return statementHTML(q,k,true); }).join('')+'</ol>':'')+
    optionsHTML(q, chosen, true, true)+
    (q.explain? '<div class="explain">'+q.explain.split("\n").map(function(l){return '<div class="line">'+esc(l)+'</div>';}).join('')+'</div>':'')+'</div>';
}
function renderDrillDone(){
  var n=S.items.length, ok=S.items.filter(function(q,i){return S.ans[i]===q.ans;}).length;
  var wrong = S.items.map(function(q,i){ return S.ans[i]===q.ans? null : '<li class="ritem"><button data-action="toggle" data-i="'+i+'" aria-expanded="false"><span class="mk ng">×</span><span>問'+q.slot+'　'+esc(topicName(S.level,q.subject,q.slot))+'</span><span class="an">('+(S.ans[i]+1)+') → ('+(q.ans+1)+')</span><span class="caret">›</span></button><div class="detail" id="d'+i+'" hidden></div></li>'; }).filter(Boolean).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>'+(S.mode==="review"?'復習':'ドリル')+'の結果</h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card"><div class="score">'+ok+'<small>／'+n+'問　'+(n?Math.round(ok/n*100):0)+'%</small></div></div>'+
    (wrong? '<div class="card"><h2>間違えた問題</h2><ul class="rlist">'+wrong+'</ul></div>' : '<div class="empty">全問正解です。</div>')+
    '<div class="row">'+(S.mode==="review"? '<button class="btn primary" data-action="review">もう一度復習</button>' : '<button class="btn primary" data-action="drillslots" data-subject="'+S.subject+'">論点を選び直す</button>')+'</div>'+
  '</div>';
}
function renderStats(){
  var lv = store.level;
  var hist = store.history.filter(function(h){return h.level===lv;}).slice(0,20);
  var rows = hist.map(function(h){ var d=new Date(h.t); return '<tr><td>'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</td><td><span class="tag '+SUBJ[h.subject].cls+'">'+SUBJ[h.subject].name+'</span></td><td class="num">'+h.score+'／'+h.total+'</td><td class="pf '+(h.pass?'ok':'ng')+'">'+(h.pass?'合格':'不合格')+'</td></tr>'; }).join('');
  var sections = LEVELS[lv].subjects.map(function(s){
    var topics = topicsFor(lv,s); if(!topics.length) return '';
    var bars = topics.map(function(t){
      var seen=0, ok=0;
      poolFor(lv,s,[t.no]).forEach(function(q){ var r=store.q[q.id]; if(r){ seen+=r.seen; ok+=r.ok; } });
      var pct = seen? Math.round(ok/seen*100) : null;
      var cls = pct===null? '' : (pct<60?' low': pct<80?' mid':'');
      return '<div class="bar"><span class="n">'+t.no+'</span><div class="track"><div class="fill'+cls+'" style="width:'+(pct||0)+'%"></div></div><span class="v">'+(pct===null?'—':pct+'%　'+ok+'/'+seen)+'</span><span class="name">'+esc(t.name)+'</span></div>';
    }).join('');
    return '<div class="card"><h2><span class="tag '+SUBJ[s].cls+'">'+SUBJ[s].name+'</span>　論点別の正答率</h2><p class="muted small">模擬試験・ドリル・復習の解答をすべて集計しています。</p><div class="bars" style="margin-top:10px">'+bars+'</div></div>';
  }).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>成績　<span class="muted small">'+esc(LEVELS[lv].short)+'</span></h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card"><h2>模擬試験の履歴</h2>'+(rows? '<table class="hist"><thead><tr><th>日時</th><th>科目</th><th>得点</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<p class="muted small" style="margin-top:6px">まだ模擬試験の記録がありません。</p>')+'</div>'+
    sections+
    '<div class="row"><button class="btn danger" data-action="reset">成績をすべて消す</button></div>'+
  '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-action]'); if(!b) return;
  var act = b.getAttribute('data-action');
  if(act==="level"){ var lv=b.getAttribute('data-level'); if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断して級を切り替えますか？')) return; stopTimer(); S=null; } store.level=lv; save(); drillSel=null; view={name:"home"}; render(); return; }
  if(act==="home"){ if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; drillSel=null; view={name:"home"}; render(); return; }
  if(act==="setup"){ drillSel=null; view={name:"setup", mode:b.getAttribute('data-mode')}; render(); return; }
  if(act==="exam"){ startExam(store.level, b.getAttribute('data-subject')); return; }
  if(act==="drillslots"){ drillSel=null; view={name:"drillslots", subject:b.getAttribute('data-subject')}; render(); return; }
  if(act==="chip"){ var s=+b.getAttribute('data-slot'); var k=drillSel.indexOf(s); if(k>=0) drillSel.splice(k,1); else drillSel.push(s); render(); return; }
  if(act==="chipall"){ drillSel = topicsFor(store.level, view.subject).map(function(t){return t.no;}); render(); return; }
  if(act==="chipnone"){ drillSel = []; render(); return; }
  if(act==="drillstart"){ startDrill(store.level, b.getAttribute('data-subject'), drillSel.slice()); return; }
  if(act==="review"){ startReview(store.level); return; }
  if(act==="stats"){ view={name:"stats"}; render(); return; }
  if(act==="reset"){ if(confirm('この端末に保存された成績と復習データをすべて消します。よろしいですか？')){ store.history=[]; store.q={}; save(); render(); } return; }
  if(act==="strike"){ if(!S) return; var si=+b.getAttribute('data-i'); var ss=strikeSet(); var p=ss.indexOf(si); if(p>=0) ss.splice(p,1); else ss.push(si); render(); return; }
  if(act==="choose"){
    var i=+b.getAttribute('data-i'); var q=S.items[S.idx];
    if(S.mode==="exam"){ S.ans[S.idx]=i; render(); return; }
    if(S.revealed[S.idx]) return;
    S.ans[S.idx]=i; S.revealed[S.idx]=true; record(q, i===q.ans); render(); return;
  }
  if(act==="prev"){ if(S.idx>0){ S.idx--; render(); } return; }
  if(act==="next"){ if(S.idx<S.items.length-1){ S.idx++; render(); } return; }
  if(act==="jump"){ S.idx=+b.getAttribute('data-i'); render(); return; }
  if(act==="finish"){ var un=S.ans.filter(function(a){return a<0;}).length; if(un && !confirm('未解答が '+un+' 問あります。採点しますか？')) return; finishExam(false); return; }
  if(act==="abort"){ if(S.mode==="exam"){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; view={name:"home"}; render(); return; }
  if(act==="drilldone"){ view={name:"drilldone"}; render(); return; }
  if(act==="toggle"){ var j=+b.getAttribute('data-i'); var d=document.getElementById('d'+j); var open=b.getAttribute('aria-expanded')==='true'; if(open){ d.hidden=true; d.innerHTML=''; b.setAttribute('aria-expanded','false'); } else { d.innerHTML=detailHTML(S.items[j], S.ans[j]); d.hidden=false; b.setAttribute('aria-expanded','true'); } return; }
});
document.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.getAttribute && e.target.getAttribute('data-action')==='strike'){ e.preventDefault(); e.target.click(); } });
window.addEventListener('beforeunload', function(e){ if(S && S.mode==="exam" && !S.finished){ e.preventDefault(); e.returnValue=''; } });

render();
})();
</script>
</body>
</html>
