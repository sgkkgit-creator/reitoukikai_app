<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>冷凍機械責任者 試験対策</title>
<style>
:root{
  --paper:#F4F7F8; --card:#FFFFFF; --ink:#17242F; --muted:#5D6C78; --line:#D8E0E6; --line-strong:#B8C4CD;
  --teal:#0F6B7A; --teal-ink:#0B5460; --frost:#E3F0F2;
  --law:#24507A; --law-bg:#E7EEF6;
  --safety:#0F6B7A; --safety-bg:#E3F0F2;
  --gaku:#6A3F78; --gaku-bg:#F0E8F3;
  --ok:#2C7A4B; --ok-bg:#E4F2E9; --ng:#B3372D; --ng-bg:#F8E7E4; --warn:#B4741A; --warn-bg:#FBF1E0;
  --r:10px; --r-sm:6px;
  --fs:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-feature-settings:"palt";}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #2A8FA3;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);}
.top-in{max-width:720px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;line-height:1.2}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{max-width:720px;margin:0 auto;padding:16px 14px 48px}

/* generic */
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);font-weight:600}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:disabled{background:#9DB9BE;border-color:#9DB9BE;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal-ink)}
.btn.danger{color:var(--ng);border-color:#E3B9B4}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.block{width:100%}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;line-height:1.5}
.tag.law{background:var(--law-bg);color:var(--law)} .tag.safety{background:var(--safety-bg);color:var(--safety)} .tag.gaku{background:var(--gaku-bg);color:var(--gaku)}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-size:17px}
.tile span{color:var(--muted);font-size:13px}
.tile:hover{border-color:var(--teal)}
.hero{padding:6px 2px 2px}
.hero h1{font-size:24px}
.hero .lv{color:var(--teal-ink)}
.subjline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.subjline .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px}
.pill .dot{width:10px;height:10px;border-radius:50%}
.dot.law{background:var(--law)} .dot.safety{background:var(--safety)} .dot.gaku{background:var(--gaku)}

/* setup */
.opt-card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt-card[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.opt-card .t{font-weight:700}
.opt-card .d{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{display:inline-block;min-width:1.6em;color:inherit;opacity:.7;font-variant-numeric:tabular-nums}

/* question */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qbar .prog{font-variant-numeric:tabular-nums;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:var(--r-sm);background:var(--frost);color:var(--teal-ink)}
.timer.low{background:var(--ng-bg);color:var(--ng)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--teal)}
.qpaper{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qno{display:inline-block;background:var(--ink);color:#fff;font-weight:700;padding:2px 10px;border-radius:4px;font-size:15px;letter-spacing:.06em}
.qtopic{color:var(--muted);font-size:13px}
.stem{font-size:16px;line-height:1.75}
.figure{margin:14px 0 4px}
.figure svg{width:100%;height:auto;display:block}
.given{margin:12px 0 0;padding:10px 12px;background:var(--paper);border-radius:var(--r-sm);font-size:14px;line-height:1.7}
.given b{font-weight:600}
.stmts{list-style:none;margin:14px 0 0;padding:0}
.stmt{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stmt:last-child{border-bottom:1px solid var(--line)}
.kana{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1;margin-top:1px}
.stmt.ok .kana{background:var(--ok);border-color:var(--ok);color:#fff}
.stmt.ng .kana{background:var(--ng);border-color:var(--ng);color:#fff}
.stmt .t{line-height:1.7}
.stmt.can{cursor:pointer}
.stmt.struck .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ng);color:var(--muted)}
.stmt.struck .kana{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.hintnote{margin-top:8px;font-size:12px;color:var(--muted)}
.verdict{display:inline-block;font-weight:700;font-size:13px;margin-right:6px}
.stmt.ok .verdict{color:var(--ok)} .stmt.ng .verdict{color:var(--ng)}
.why{margin-top:6px;font-size:14px;line-height:1.65;color:#2F3D48;background:var(--paper);border-radius:var(--r-sm);padding:8px 10px}
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;min-height:48px;padding:8px 12px 8px 8px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card)}
.opt .num{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .lab{font-weight:600;letter-spacing:.04em}
.opt .mark{font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#F0F3F5}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
.opt.wrong .mark{color:var(--ng)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px;border-radius:var(--r-sm);background:var(--paper);font-size:14px;line-height:1.75}
.explain .line{font-variant-numeric:tabular-nums}
.result-line{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);font-weight:700}
.result-line.ok{background:var(--ok-bg);color:var(--ok)} .result-line.ng{background:var(--ng-bg);color:var(--ng)}
.nav{display:flex;gap:8px;margin-top:14px;justify-content:space-between;align-items:center}
.nav .btn{min-width:96px}
.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.sheet button{min-height:36px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.sheet button.answered{background:var(--frost);border-color:var(--teal)}
.sheet button.current{outline:2px solid var(--ink);outline-offset:-2px}

/* result */
.stamp-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stamp{width:112px;height:112px;border-radius:50%;border:4px double var(--ng);color:var(--ng);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:.12em;transform:rotate(-9deg);flex:none;padding-left:.12em}
.stamp.pass{border-color:var(--ok);color:var(--ok)}
.score{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:16px;font-weight:600;color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0}
.ritem{border-top:1px solid var(--line)}
.ritem:last-child{border-bottom:1px solid var(--line)}
.ritem>button{width:100%;text-align:left;background:transparent;border:0;padding:10px 4px;display:grid;grid-template-columns:44px 1fr 92px 20px;gap:8px;align-items:center}
.ritem .mk{font-weight:800}
.ritem .mk.ok{color:var(--ok)} .ritem .mk.ng{color:var(--ng)}
.ritem .an{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ritem .caret{color:var(--muted);text-align:right}
.ritem .detail{padding:0 4px 14px}

/* stats */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:32px 1fr 64px;gap:8px;align-items:center;font-size:14px}
.bar .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--teal);border-radius:6px}
.bar .fill.low{background:var(--ng)}
.bar .fill.mid{background:var(--warn)}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:13px}
.bar .name{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.hist th{color:var(--muted);font-weight:600;font-size:12px}
.hist td.num{text-align:right;font-variant-numeric:tabular-nums}
.pf{font-weight:700}
.pf.ok{color:var(--ok)} .pf.ng{color:var(--ng)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}
.notice{padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-bg);color:#6B4A0F;font-size:14px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">冷凍機械責任者 試験対策<small id="brand-sub"></small></div>
    <div class="seg" role="group" aria-label="受験級">
      <button type="button" data-action="level" data-level="3" aria-pressed="true">三冷</button>
      <button type="button" data-action="level" data-level="2" aria-pressed="false">二冷</button>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"></main>

,"why":"1日の冷凍能力3トン未満の冷凍設備内の高圧ガスは、ガスの種類にかかわらず適用除外（施行令第2条第3項）。"},{"k":"ハ","t":"1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスである二酸化炭素","ok":true,"why":"二酸化炭素及び難燃性基準に適合するフルオロカーボンは、3トン以上5トン未満でも適用除外。"}],"opts":[[0],[2],[0,2],[1,2],[0,1,2]],"ans":3},{"id":"L02-2","levels":["3","2"],"subject":"law","slot":2,"stem":"次のイ、ロ、ハの記述のうち、正しいものはどれか。","statements":[{"k":"イ","t":"1日の冷凍能力が5トン以上の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず高圧ガス保安法の適用を受ける。","ok":true,"why":"冷凍能力による適用除外は5トン未満まで。5トン以上はガスの種類を問わず法の適用を受ける。"},{"k":"ロ","t":"1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスであるフルオロカーボンは、その燃焼性にかかわらず、すべて適用除外となる。","ok":false,"why":"適用除外となるフルオロカーボンは「難燃性を有するものとして所定の燃焼性の基準に適合するもの」に限られる。"},{"k":"ハ","t":"フルオロカーボン回収装置内における特に定められたフルオロカーボンは、高圧ガス保安法の適用が除外される。","ok":true,"why":"施行令第2条第3項で、フルオロカーボン回収装置内のフルオロカーボン（特に定めるもの）は適用除外とされている。"}],"opts":[[0],[1],[0,1],[0,2],[0,1,2]],"ans":3},{"id":"L03-1","levels":["3","2"],"subject":"law","slot":3,"stem":"次のイ、ロ、ハのうち、冷凍のため高圧ガスの製造をしようとする場合に、都道府県知事等の許可を受けなければならない者はどれか。","statements":[{"k":"イ","t":"不活性ガスであるフルオロカーボンを冷媒ガスとする1日の冷凍能力が60トンである製造設備（認定指定設備を除く。）のみを使用して製造をしようとする者","ok":true,"why":"不活性フルオロカーボン・二酸化炭素・アンモニアは1日の冷凍能力50トン以上で第一種製造者（許可）。60トンは該当する。"},{"k":"ロ","t":"アンモニアを冷媒ガスとする1日の冷凍能力が30トンである製造設備のみを使用して製造をしようとする者","ok":false,"why":"アンモニアは5トン以上50トン未満が第二種製造者（届出）。30トンは許可ではなく届出。"},{"k":"ハ","t":"二酸化炭素を冷媒ガスとする1日の冷凍能力が45トンである製造設備のみを使用して製造をしようとする者","ok":false,"why":"二酸化炭素は20トン以上50トン未満が第二種製造者（届出）。45トンは許可不要。"}],"opts":[[0],[2],[0,1],[0,2],[1,2]],"ans":0},{"id":"L03-2","levels":["3","2"],"subject":"law","slot":3,"stem":"次のイ、ロ、ハの記述のうち、正しいものはどれか。","statements":[{"k":"イ","t":"冷凍のため高圧ガスの製造をしようとする者が都道府県知事等の許可を受けなければならない1日の冷凍能力の最小の値は、冷媒ガスの種類により異なる。","ok":true,"why":"原則20トン以上だが、不活性フルオロカーボン・二酸化炭素・アンモニア・不活性以外のフルオロカーボンは50トン以上と、ガスの種類で異なる（施行令第4条）。"},{"k":"ロ","t":"認定指定設備のみを使用して冷凍のため高圧ガスの製造をしようとする者は、その1日の冷凍能力が50トン以上であっても、都道府県知事等の許可を受ける必要はなく、届出を行えばよい。","ok":true,"why":"法第5条第2項第2号。認定指定設備のみを使用する者は冷凍能力にかかわらず第二種製造者（届出）。"},{"k":"ハ","t":"第一種製造者は、高圧ガスの製造を開始したときは遅滞なくその旨を都道府県知事等に届け出なければならないが、製造を廃止したときは届け出る必要はない。","ok":false,"why":"法第21条。製造の開始・廃止のいずれも遅滞なく届け出なければならない。"}],"opts":[[0],[1],[0,1],[0,2],[0,1,2]],"ans":2},{"id":"L04-1","levels":["3","2"],"subject":"law","slot":4,"stem":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"液化アンモニアの充塡容器及び残ガス容器は、それぞれ区分して容器置場に置かなければならない。","ok":true,"why":"充塡容器と残ガス容器は区分して容器置場に置く。ガスの種類を問わず適用される。"},{"k":"ロ","t":"不活性ガスである液化フルオロカーボンの充塡容器及び残ガス容器は、常に温度40度以下に保たなければならない。","ok":true,"why":"充塡容器等は常に40度以下に保つ。不活性ガスにも適用される。"},{"k":"ハ","t":"液化アンモニアの容器置場の周囲2メートル以内では火気の使用を禁じ、かつ、引火性又は発火性の物を置いてはならないが、この定めは不活性ガスである液化フルオロカーボンの容器置場には適用されない。","ok":true,"why":"容器置場周囲2m以内の火気制限は、不活性ガス及び空気の容器置場には適用されない。アンモニアは可燃性・毒性ガスなので適用される。"}],"opts":[[0],[0,1],[0,2],[1,2],[0,1,2]],"ans":4},{"id":"L04-2","levels":["3","2"],"subject":"law","slot":4,"stem":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする事業所における冷媒ガスの補充用としての容器による高圧ガスの貯蔵の方法に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"液化アンモニアを充塡容器により貯蔵する場合、その容器を車両に積載した状態で貯蔵することは、特に定められた場合を除き禁じられている。","ok":true,"why":"貯蔵は、車両等に固定し又は積載した容器によりしてはならない（特に定める場合を除く）。ガスの種類を問わない。"},{"k":"ロ","t":"貯蔵する液化ガスの質量が1.5キログラム以下の容器による貯蔵についても、貯蔵の方法に係る技術上の基準が適用される。","ok":false,"why":"容積0.15立方メートル（液化ガスでは質量1.5kg）以下の貯蔵には、貯蔵の技術上の基準は適用されない（法第15条、一般則第19条）。"},{"k":"ハ","t":"液化アンモニアの充塡容器等は、通風の良い場所で貯蔵しなければならない。","ok":true,"why":"可燃性ガス又は毒性ガスの充塡容器等の貯蔵は通風の良い場所で行う。アンモニアは可燃性・毒性ガスに該当する。"}],"opts":[[1],[2],[0,1],[0,2],[1,2]],"ans":3},{"id":"L05-1","levels":["3","2"],"subject":"law","slot":5,"stem":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"不活性ガスである液化フルオロカーボンを移動するときは、充塡容器等を常に温度40度以下に保つ必要はない。","ok":false,"why":"移動中も充塡容器等は常に40度以下に保つ。不活性ガスにも適用される。"},{"k":"ロ","t":"液化アンモニアを移動するときは、その充塡容器等には、木枠又はパッキンを施さなければならない。","ok":true,"why":"毒性ガスの充塡容器等には木枠又はパッキンを施す。アンモニアは毒性ガスである。"},{"k":"ハ","t":"液化アンモニアを移動するときは、そのガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等を携行しなければならない。","ok":true,"why":"毒性ガスの移動では保護具・応急措置用の資材・薬剤・工具等の携行が義務付けられている。" スの製造設備には除害措置が必要。専用機械室に設置していても免除されない。"},{"k":"ハ","t":"冷媒設備に設けた安全弁には放出管を設けなければならないが、その放出管の開口部の位置については、製造設備を専用機械室に設置する場合は特に定められていない。","ok":false,"why":"放出管の開口部は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。専用機械室設置による免除規定はない。"}],"opts":[[1],[2],[0,1],[0,2],[1,2]],"ans":2},{"id":"L15-2","levels":["3","2"],"subject":"law","slot":15,"stem":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとしなければならない。","ok":false,"why":"電気設備の防爆性能の基準は可燃性ガスの製造設備に適用されるが、アンモニアは明文で除かれている。"},{"k":"ロ","t":"製造施設には、冷媒ガスが漏えいしたときに滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。","ok":true,"why":"可燃性・毒性・特定不活性ガスの製造施設にはガス漏えい検知警報設備が必要。専用機械室・強制換気でも免除されない。"},{"k":"ハ","t":"製造施設には、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない。","ok":true,"why":"可燃性ガスの製造施設には規模に応じた消火設備を設ける。アンモニアは可燃性ガスに該当する。"}],"opts":[[1],[2],[0,1],[1,2],[0,1,2]],"ans":3},{"id":"L16-1","levels":["3","2"],"subject":"law","slot":16,"stem":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとしなければならない。","ok":true,"why":"可燃性・毒性ガスを冷媒とする冷媒設備の受液器には、丸形ガラス管液面計を使用できない。"},{"k":"ロ","t":"受液器に設けたガラス管液面計には、その破損を防止するための措置を講じ、かつ、受液器とガラス管液面計とを接続する配管には、その液面計の破損による漏えいを防止するための措置を講じなければならない。","ok":true,"why":"ガラス管液面計の破損防止措置はすべての冷媒に、接続配管の漏えい防止措置は可燃性・毒性ガスの場合に必要。"},{"k":"ハ","t":"内容積が5,000リットルの受液器の周囲には、液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならない。","ok":false,"why":"流出防止措置が必要なのは内容積1万リットル以上の受液器。5,000リットルは該当しない。"}],"opts":[[0],[1],[2],[0,1],[0,2]],"ans":3},{"id":"L16-2","levels":["3","2"],"subject":"law","slot":16,"stem":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"内容積が12,000リットルの受液器の周囲には、液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならない。","ok":true,"why":"可燃性・毒性・特定不活性ガスの冷媒設備で内容積1万リットル以上の受液器には流出防止措置が必要。"},{"k":"ロ","t":"製造設備が専用機械室に設置され、その室を常時強制換気している場合には、漏えいしたガスを検知し警報するための設備を設ける必要はない。","ok":false,"why":"ガス漏えい検知警報設備は、専用機械室・常時強制換気の場合でも免除されない。"},{"k":"ハ","t":"内容積が5,000リットル以上の受液器並びにその支持構造物及び基礎は、所定の耐震に関する性能を有しなければならない。","ok":true,"why":"耐震性能が必要なのは、縦置円筒形で胴部長さ5m以上の凝縮器、内容積5,000リットル以上の受液器、及び所定の配管。"}],"opts":[[2],[0,1],[0,2],[1,2],[0,1,2]],"ans":2},{"id":"L17-1","levels":["3","2"],"subject":"law","slot":17,"stem":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"横置円筒形であって、胴部の長さが6メートルの凝縮器は、所定の耐震に関する性能を有しなければならないものに該当する。","ok":false,"why":"耐震性能が求められる凝縮器は「縦置円筒形で胴部の長さが5m以上」のもの。横置円筒形は長さにかかわらず該当しない。"},{"k":"ロ","t":"完成検査において配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.5倍以上の圧力で行わなければならない。","ok":true,"why":"液体による耐圧試験は許容圧力の1.5倍以上。気体を使用する場合は1.25倍以上。"},{"k":"ハ","t":"冷媒設備の気密試験は、許容圧力以上の圧力で行わなければならない。","ok":true,"why":"気密試験は許容圧力以上の圧力で行う（冷凍則第7条第1項第6号）。"}],"opts":[[1],[0,1],[0,2],[1,2],[0,1,2]],"ans":3},{"id":"L17-2","levels":["3","2"],"subject":"law","slot":17,"stem":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"配管以外の冷媒設備の耐圧試験は、水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25倍以上の圧力で行うことができる。","ok":true,"why":"液体の使用が困難な場合は、気体で許容圧力の1.25倍以上の圧力により行うことができる。"},{"k":"ロ","t":"製造設備に設けたバルブ又はコックには作業員が適切に操作できるような措置を講じなければならないが、操作ボタン等により開閉されるものについては、その定めはない。","ok":false,"why":"操作ボタン等で開閉する場合はその操作ボタン等が対象になる。除かれるのは操作ボタン等を使用せず自動制御で開閉されるバルブ・コックである。"},{"k":"ハ","t":"冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。","ok":true,"why":"冷凍則第7条第1項第8号のとおり。基準は許容圧力であり、耐圧試験圧力ではない。"}],"opts":[[0],[1],[2],[0,1],[0,2]],"ans":4},{"id":"L18-1","levels":["3","2"],"subject":"law","slot":18,"stem":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。","statements":[{"k":"イ","t":"製造設備を専用機械室に設置し、外部の者が容易に立ち入れないようにしたので、製造施設に警戒標を掲げなかった。","ok":false,"why":"製造施設には外部から見やすいように警戒標を掲げなければならない。専用機械室設置による免除はない。"},{"k":"ロ","t":"圧縮機と凝縮器との間の配管の付近に製造設備外の火気を設置せざるを得なかったので、その火気に対して安全な措置を講じた。","ok":true,"why":"圧縮機・油分離器・凝縮器・受液器及びこれらの間の配管は火気の付近に置かないことが原則だが、火気に対して安全な措置を講じた場合はよい。"},{"k":"ハ","t":"冷媒設備には圧力計を設けたが、強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有する圧縮機の油圧系統には圧力計を設けなかった。","ok":true,"why":"圧力計を設けるべき冷媒設備には圧縮機の油圧系統も含まれるが、強制潤滑方式で油圧保護装置を有するものの油圧系統は除かれる。"}],"opts":[[2],[0,1],[0,2],[1,2],[0,1,2]],"ans":3},{"id":"L18-2","levels":["3","2"],"subject":"law","slot":18,"stem":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。","statements":[{"k":"イ","t":"配管の変更の工事の完成後に、その配管について、許容圧力の1.2倍の圧力で気密試験を行った。","ok":true,"why":"気密試験は許容圧力以上で行えばよい。1.2倍は許容圧力以上であり適合している。"},{"k":"ロ","t":"配管以外の冷媒設備について、水を使用して許容圧力の1.3倍の圧力で耐圧試験を行った。","ok":false,"why":"液体による耐圧試験は許容圧力の1.5倍以上でなければならない。1.3倍では不適合。"},{"k":"ハ","t":"製造設備は、振動、衝撃、腐食等により冷媒ガスが漏れないものとした。","ok":true,"why":"冷凍則第7条第1項第4号のとおり。"}],"opts":[[0],[1],[2],[0,1],[0,2]],"ans":4},{"id":"L19-1","levels":["3","2"],"subject":"law","slot":19,"stem":"次のイ、ロ、ハの記述のうち、第一種製造者の製造の方法に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。","statements":[{"k":"イ","t":"高圧ガスの製造は、1日に1回以上、製造設備の属する製造施設の異常の有無を点検して行っている。","ok":true,"why":"冷凍則第9条第2号。1日1回以上、製造施設（冷媒設備だけではない）の異常の有無を点検する。"},{"k":"ロ","t":"冷媒設備に設けた安全弁に付帯して設けた止め弁は、通常の運転中は常に全開にしており、安全弁の修理のため特に必要なときに限り閉止している。","ok":true,"why":"安全弁に付帯する止め弁は常に全開。修理又は清掃のため特に必要な場合のみ閉止できる。"},{"k":"ハ","t":"冷媒設備の修理が終了したので、その冷媒設備が正常に作動することを確認する前に高圧ガスの製造を再開した。","ok":false,"why":"修理等が終了したときは、正常に作動することを確認した後でなければ製造をしてはならない。"}],"opts":[[0],[2],[0,1],[0,2],[0,1,2]],"ans":2},{"id":"L19-2","levels":["3","2"],"subject":"law","slot":19,"stem":"次のイ、ロ、ハの記述のうち、第一種製造者の製造の方法に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。","statements":[{"k":"イ","t":"安全弁の修理及び清掃が終了した後、製造設備の運転を数日間停止するので、その間、安全弁に付帯して設けた止め弁を閉止した。","ok":false,"why":"止め弁を閉止できるのは安全弁の修理又は清掃のため特に必要な場合のみ。運転停止中であっても全開にしておく。"},{"k":"ロ","t":"冷媒設備の修理を行うため、あらかじめ修理の作業計画及びその作業の責任者を定め、修理はその責任者の監視の下で行った。","ok":true,"why":"修理等は、あらかじめ作業計画及び責任者を定め、責任者の監視の下に行うか、異常時に直ちに責任者に通報する措置を講じて行う。"},{"k":"ハ","t":"冷媒設備を開放して修理するとき、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じた。","ok":true,"why":"冷凍則第9条第3号ハのとおり。開放修理時の漏えい防止措置。"}],"opts":[[0],[2],[0,2],[1,2],[0,1,2]],"ans":3},{"id":"L20-1","levels":["3","2"],"subject":"law","slot":20,"stem":"次のイ、ロ、ハの記述のうち、認定指定設備である製造設備について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"製造設備が認定指定設備である条件の一つには、「冷媒設備は、その認定指定設備の製造業者の事業所において、脚上又は一つの架台上に一体に組み立てられていること。」がある。","ok":true,"why":"冷凍則第57条の指定設備の技術上の基準のとおり。"},{"k":"ロ","t":"製造設備が認定指定設備である条件の一つには、「冷媒設備は、その認定指定設備の製造業者の事業所において、所定の気密試験及び耐圧試験並びに試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。","ok":true,"why":"製造業者の事業所で試験・試運転を行い、分割されずに搬入されることが条件。「分割して搬入」は誤りの典型。"},{"k":"ハ","t":"製造設備が認定指定設備である条件の一つには、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用すること。」がある。","ok":false,"why":"日常の運転操作に必要となる冷媒ガスの止め弁には「手動式のものを使用しないこと」が条件。"}],"opts":[[1],[2],[0,1],[0,2],[0,1,2]],"ans":2},{"id":"L20-2","levels":["3","2"],"subject":"law","slot":20,"stem":"次のイ、ロ、ハの記述のうち、認定指定設備である製造設備について正しいものはどれか。","statements":[{"k":"イ","t":"認定指定設備のみを使用して冷凍のため高圧ガスの製造をする者は、定期自主検査を行う必要はない。","ok":false,"why":"認定指定設備を使用する第二種製造者も定期自主検査を行わなければならない（法第35条の2）。"},{"k":"ロ","t":"認定指定設備に変更の工事（特に定められたものを除く。）を施したときは、指定設備認定証は無効となる。","ok":true,"why":"冷凍則第62条。同等部品への交換のみなど特に定めた場合を除き、変更の工事で認定証は無効になり返納しなければならない。"},{"k":"ハ","t":"認定指定設備を移設したときは、変更の工事を施していない場合であっても、指定設備認定証が無効となる場合がある。","ok":true,"why":"移設等を行うと原則として認定証は無効になる。指定設備認定機関等の調査を受け技術基準適合書の交付を受けた場合は例外。"}],"opts":[[0],[1],[2],[0,1],[1,2]],"ans":4},{"id":"S01-1","levels":["3"],"subject":"safety","slot":1,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理について正しいものはどれか。","statements":[{"k":"イ","t":"冷媒液が蒸発するときに周囲から奪う熱を蒸発潜熱といい、この作用を利用して物を冷却するのが蒸気圧縮式冷凍装置である。","ok":true,"why":"蒸発器で冷媒液が蒸発潜熱を奪って被冷却物を冷やす。状態変化に伴う熱が潜熱、温度変化に伴う熱が顕熱。"},{"k":"ロ","t":"理論冷凍サイクルにおいて、凝縮器で放出される熱量は、蒸発器で吸収した熱量と圧縮機で冷媒に加えられた仕事の熱当量との和に等しい。","ok":true,"why":"凝縮負荷 Φk＝Φo＋P。凝縮器は冷凍能力と圧縮動力の両方を放熱する。"},{"k":"ハ","t":"膨張弁では、冷媒液の圧力が下がるとともに比エンタルピーが減少する。","ok":false,"why":"膨張弁での絞り膨張は等エンタルピー変化（h3＝h4）。圧力と温度は下がるが比エンタルピーは変わらない。"},{"k":"ニ","t":"圧縮機での圧縮過程は、理論上、等エンタルピー変化として扱う。","ok":false,"why":"理論圧縮は断熱圧縮＝等エントロピー変化。比エンタルピーは h1 から h2 へ増加する。"}],"opts":[[0,1],[0,3],[1,3],[0,2,3],[1,2,3]],"ans":0},{"id":"S01-2","levels":["3"],"subject":"safety","slot":1,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理について正しいものはどれか。","statements":[{"k":"イ","t いものはどれか。","statements":[{"k":"イ","t":"圧縮機の体積効率は、実際に吸い込む冷媒蒸気の体積をピストン押しのけ量で除した値で、圧力比が大きくなると小さくなる。","ok":true,"why":"ηv＝qvr／V。圧力比の増大やすきま容積比の増大で体積効率は低下する。"},{"k":"ロ","t":"実際の圧縮機駆動の軸動力は、理論断熱圧縮動力を断熱効率と機械効率の積で除して求められる。","ok":true,"why":"P＝Pth／(ηc・ηm)。断熱効率と機械効率はいずれも1より小さいので軸動力は理論値より大きい。"},{"k":"ハ","t":"圧縮機の吸込み蒸気の過熱度が大きくなると比体積が小さくなり、冷媒循環量が増加する。","ok":false,"why":"過熱度が大きいほど吸込み蒸気の比体積は大きくなり、qmr＝qvr／v1 より冷媒循環量は減少する。"},{"k":"ニ","t":"冷凍装置の実際の成績係数は、理論成績係数に断熱効率と機械効率の積を乗じた値になる。","ok":true,"why":"(COP)R実際＝Φo／P＝Φo・ηc・ηm／Pth＝(COP)th・ηc・ηm。"}],"opts":[[0,1],[0,3],[1,2],[0,1,2],[0,1,3]],"ans":4},{"id":"S03-2","levels":["3"],"subject":"safety","slot":3,"stem":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の性能などについて正しいものはどれか。","statements":[{"k":"イ","t":"往復圧縮機のピストン押しのけ量は、1つのピストンの行程容積、気筒数及び回転速度の積で表され、回転速度を上げると押しのけ量は増加する。","ok":true,"why":"V＝行程容積×気筒数×回転速度。インバータによる回転速度制御は容量制御に利用される。"},{"k":"ロ","t":"断熱効率は、圧縮機で実際に冷媒蒸気に加えられた動力を理論断熱圧縮動力で除した値である。","ok":false,"why":"断熱効率 ηc＝理論断熱圧縮動力／実際に蒸気に加えられた動力。分母と分子が逆。"},{"k":"ハ","t":"圧縮機の吸込み蒸気圧力が低下し、吐出しガス圧力が上昇すると、圧力比が増大して体積効率と断熱効率がともに低下する。","ok":true,"why":"圧力比の増大は体積効率・断熱効率・機械効率をいずれも低下させ、成績係数を悪化させる。"},{"k":"ニ","t":"機械的摩擦損失仕事が熱として吐出しガスに加わる場合、実際の吐出しガスの比エンタルピーは、理論断熱圧縮後の値より小さくなる。","ok":false,"why":"実際の吐出しガス比エンタルピー h2'＝h1＋(h2−h1)／(ηc・ηm) となり理論値より大きい。"}],"opts":[[0,1],[0,2],[0,3],[0,1,3],[1,2,3]],"ans":1},{"id":"S04-1","levels":["3"],"subject":"safety","slot":4,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒、冷凍機油及びブラインについて正しいものはどれか。","statements":[{"k":"イ","t":"アンモニアガスは空気より軽く、アンモニア液は鉱油より軽いので、アンモニア冷凍装置では油は液の下に溜まる。","ok":true,"why":"アンモニアは空気より軽く、液は鉱油より軽い。フルオロカーボンはその逆で、ガスは空気より重く、液は油より重い。"},{"k":"ロ","t":"フルオロカーボン冷媒中に水分が混入すると、低温部の膨張弁で氷結して冷媒の流れを妨げたり、冷媒が加水分解して酸を生成し金属を腐食させることがある。","ok":true,"why":"フルオロカーボンは水をほとんど溶かさないため、遊離水分が氷結や酸生成（銅めっき現象の一因）を起こす。"},{"k":"ハ","t":"塩化カルシウムブラインは、濃度を高くしていくと凍結温度は下がり続け、共晶点は存在しない。","ok":false,"why":"塩化カルシウムブラインには共晶点（約−55℃）があり、それ以上濃度を上げると凍結温度は逆に上昇する。"},{"k":"ニ","t":"アンモニアは銅及び銅合金を腐食するので、アンモニア冷凍装置の配管には鋼管を用いる。","ok":true,"why":"アンモニアは銅・銅合金を侵すため鋼管・鋼製部品を使用する。フルオロカーボンには銅管が使える。"}],"opts":[[0,2],[1,3],[2,3],[0,1,2],[0,1,3]],"ans":4},{"id":"S04-2","levels":["3"],"subject":"safety","slot":4,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒及び冷凍機油について正しいものはどれか。","statements":[{"k":"イ","t":"R410AやR404Aのような混合冷媒は非共沸混合冷媒であり、漏えい時に組成が変化するおそれがあるため、充塡は液で行う。","ok":true,"why":"非共沸混合冷媒は成分ごとに蒸発・凝縮しやすさが異なる。蒸気で充塡すると組成が変わるため液充塡とする。"},{"k":"ロ","t":"HFC冷媒のR32やR410Aには、鉱油との相溶性がよいため一般に鉱油が使用される。","ok":false,"why":"HFC冷媒は鉱油と溶け合わないため、POE（ポリオールエステル）などの合成油を使用する。鉱油はR22（HCFC）用。"},{"k":"ハ","t":"冷凍機油には、粘度が適当で、凝固点が低く、引火点が高く、水分や不純物を含まないことなどが求められる。","ok":true,"why":"低温で流動性を保ち（低凝固点）、高温部で安全（高引火点）で、絶縁性が高く水分を含まないことが求められる。"},{"k":"ニ","t":"二酸化炭素（R744）は、地球温暖化係数（GWP）が1で、オゾン層破壊係数（ODP）が0の自然冷媒である。","ok":true,"why":"R744（CO2）はGWP＝1、ODP＝0。R717（アンモニア）、R290（プロパン）とともに自然冷媒と呼ばれる。"}],"opts":[[0,2],[0,3],[1,2],[1,3],[0,2,3]],"ans":4},{"id":"S05-1","levels":["3"],"subject":"safety","slot":5,"stem":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。","statements":[{"k":"イ","t":"圧縮機は冷媒蒸気の圧縮方法により容積式と遠心式に大別され、往復式、スクリュー式、スクロール式はいずれも容積式である。","ok":true,"why":"「往復式と遠心式に大別」は誤りの典型。容積式（往復・ロータリー・スクロール・スクリュー）と遠心式に分ける。"},{"k":"ロ","t":"全密閉圧縮機は電動機と圧縮機が一つの容器に密封されており、電動機は一般に吸込み蒸気で冷却される。","ok":true,"why":"全密閉形は吸込み蒸気が電動機を冷却しながら圧縮室に入る構造が一般的。"},{"k":"ハ","t":"多気筒往復圧縮機の容量制御は、吸込み弁を開放して作動気筒数を減らすアンローダ機構などにより行う。","ok":true,"why":"アンローダは一部の気筒の吸込み弁を開いたままにして圧縮させず、段階的に容量を制御する。始動時の負荷軽減にも使う。"},{"k":"ニ","t":"スクリュー圧縮機のスライド弁による容量制御は、段階的にしか行えない。","ok":false,"why":"スライド弁による容量制御は無段階に行える。"}],"opts":[[0,3],[1,2],[0,1,2],[0,1,3],[0,2,3]],"ans":2},{"id":"S05-2","levels":["3"],"subject":"safety","slot":5,"stem":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。","statements":[{"k":"イ","t":"停止中の圧縮機のクランクケース内では、油温が低いほど冷媒が油に多く溶け込むので、始動時にオイルフォーミングを起こしやすい。","ok":true,"why":"油温が低いほど冷媒の溶解量が増え、始動時の圧力低下で一気に蒸発して泡立つ。「油温が高いほど起こしやすい」は誤り。"},{"k":"ロ","t":"オイルフォーミングの防止には、クランクケースヒータで停止中の油温を保つことが有効である。","ok":true,"why":"油温を保って冷媒の溶け込みを抑える。"},{"k":"ハ","t":"強制給油式往復圧縮機の給油圧力は、油圧計の指示圧力にクランクケース内圧力を加えた値である。","ok":false,"why":"給油圧力＝油圧計指示圧力−クランクケース圧力（吸込み圧力）。加えるのではなく引く。"},{"k":"ニ","t":"往復圧縮機で液圧縮（液ハンマ）が起こると、吸込み弁や吐出し弁の破損などの事故につながる。","ok":true,"why":"液は圧縮できないため、液戻りによる液圧縮は弁板や弁座、シリンダヘッドの破損を招く。"}],"opts":[[0,2],[0,3],[0,1,2],[0,1,3],[1,2,3]],"ans":3},{"id":"S06-1","levels":["3"],"subject":"safety","slot":6,"stem":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。","statements":[{"k":"イ","t":"水冷シェルアンドチューブ凝縮器では、冷却管内を冷却水が流れ、円筒胴内の冷却管外面で冷媒が凝縮する。","ok":true,"why":"管内が水、管外（胴内）が冷媒。「管外を水、管内を冷媒」と逆に書いた記述は誤り。"},{"k":"ロ","t":"空冷凝縮器の凝縮温度は、一般に水冷凝縮器の凝縮温度より高くなる。","ok":true,"why":"空気の熱伝達率が小さいため、空冷では凝縮温度が外気温度より大きく上回り、水冷より高くなる。"},{"k":"ハ","t":"凝縮器内に不凝縮ガスが混入すると、凝縮圧力は低下し、圧縮機の消費動力は減少する。","ok":false,"why":"不凝縮ガス（空気など）は伝熱を妨げ、その分圧も加わるため凝縮圧力・吐出しガス温度が上昇し、動力は増加する。"},{"k":"ニ","t":"冷媒を過充塡すると、凝縮器内の冷媒液面が上がって凝縮に有効な伝熱面積が減少し、凝縮圧力が上昇する。","ok":true,"why":"過充塡は凝縮器下部に液が溜まり有効伝熱面積を減らす。凝縮圧力の上昇とともに過冷却度は大きくなる。"}],"opts":[[0,1],[0,2],[2,3],[0,1,2],[0,1,3]],"ans":4},{"id":"S06-2","levels":["3"],"subject":"safety","slot":6,"stem":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。","statements":[{"k":"イ","t":"水冷凝縮器の冷却水の出入口温度差は一般に4〜6K程度とし、冷却水量が減少すると凝縮圧力が上昇する。","ok":true,"why":"冷却水量が減ると水の温度上昇が大きくなり、平均温度差を確保するため凝縮温度・圧力が上がる。"},{"k":"ロ","t":"冷却管に水あかが付着すると、汚れ係数が大きくなって熱通過率が低下する。","ok":true,"why":"水あかは熱伝導率が小さく、汚れ係数（付着物の熱伝導抵抗）を増して熱通過率を下げる。"},{"k":"ハ","t":"蒸発式凝縮器は、冷却水の蒸発潜熱を利用して冷媒を凝縮させるもので、アンモニア冷凍装置に多く用いられている。","ok":true,"why":"冷却管外面に水を散布し、その蒸発潜熱で凝縮させる。水の消費が少なく、アンモニア装置で多用される。"},{"k":"ニ","t":"フルオロカーボン用シェルアンドチューブ凝縮器の冷却管には、冷媒側の熱伝達率が水側より大きいので、水側にフィンを設けたローフィンチューブが用いられる。","ok":false,"why":"フルオロカーボンの凝縮側熱伝達率は水側より小さいため、冷媒側（管外）にローフィンを設けて伝熱面積を増やす。"}],"opts":[[0,3],[2,3],[0,1,2],[0,2,3],[1,2,3]],"ans":2},{"id":"S07-1","levels":["3"],"subject":"safety","slot":7,"stem":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。","statements":[{"k":"イ","t":"乾式蒸発器では、膨張弁から供給された冷媒が蒸発器内で蒸発し、出口では過熱蒸気となって圧縮機に吸い込まれる。","ok":true,"why":"乾式は蒸発器出口で過熱度をもつ。温度自動膨張弁がこの過熱度を制御する。"},{"k":"ロ","t":"満液式蒸発器は、冷却管が冷媒液に浸された状態で運転されるため、乾式蒸発器より冷媒側の熱伝達率が大きい。","ok":true,"why":"満液式は伝熱面が常に液で濡れ、過熱部もないため平均熱通過率が乾式より大きい。"},{"k":"ハ","t":"冷媒液強制循環式蒸発器では、液ポンプで蒸発量の3〜5倍程度の冷媒液を冷却管に送り込む。","ok":true,"why":"蒸発量の3〜5倍を循環させ、伝熱面を液で濡らして高い熱伝達率を得る。大形低温装置に用いる。"},{"k":"ニ","t":"空気冷却用フィンコイル蒸発器では、冷凍用より空調用のほうがフィンピッチを大きくとる。","ok":false,"why":"着霜する冷凍用はフィンピッチを大きく（粗く）し、着霜しない空調用は細かくする。"}],"opts":[[0,3],[1,2],[1,3],[0,1,2],[1,2,3]],"ans":3},{"id":"S07-2","levels":["3"],"subject":"safety","slot":7,"stem":"次のイ、ロ、ハ、ニの記述のうち、蒸発器及び除霜について正しいものはどれか。","statements":[{"k":"イ","t":"蒸発器に霜が厚く付くと、風量が減少し熱通過率も低下して、蒸発圧力が低下する。","ok":true,"why":"霜は熱伝導抵抗と空気の流れ抵抗を増やし、蒸発温度・圧力を下げて冷凍能力を低下させる。"},{"k":"ロ","t":"ホットガス除霜は、圧縮機の吐出しガスを蒸発器に送って霜を融かす方式で、霜が厚くなる前に行うのが適切である。","ok":true,"why":"霜が厚くなると除霜時間が長くなり庫内温度上昇や水はね凍結の原因になる。「厚くなってからに適する」は誤り。"},{"k":"ハ","t":"庫内温度が−20℃程度の冷凍庫では、庫内の空気で霜を融かすオフサイクル除霜が一般に用いられる。","ok":false,"why":"オフサイクル除霜は庫内温度が5℃程度以上の冷蔵庫で使える方式。−20℃の庫内空気では霜は融けない。"},{"k":"ニ","t":"蒸発温度と被冷却物の温度差を大きくとるほど成績係数は向上するので、冷蔵庫ではこの温度差をできるだけ大きくする。","ok":false,"why":"温度差を大きくすると蒸発温度が低くなり成績係数は低下する。また食品の乾燥も進むため、冷蔵では温度差を小さめにとる。"}],"opts":[[0,1],[0,2],[0,3],[2,3],[0,1,3]],"ans":0},{"id":"S08-1","levels":["3"],"subject":"safety","slot":8,"stem":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。","statements":[{"k":"イ","t":"温度自動膨張弁は、蒸発器出口の冷媒蒸気の過熱度を検出し、過熱度がほぼ一定になるように冷媒流量を調節する。","ok":true,"why":"感温筒温度（蒸発器出口温度）と蒸発圧力の差＝過熱度で弁開度を制御する。"},{"k":"ロ","t":"外部均圧形温度自動膨張弁は、ディストリビュータを用いるなど蒸発器内の圧力降下が大きい場合に使用する。","ok":true,"why":"蒸発器内の圧力降下が大きいと内部均圧形では過熱度が過大になる。蒸発器出口圧力を均圧管で導く外部均圧形を用いる。"},{"k":"ハ","t":"定圧自動膨張弁は蒸発圧力を一定に保つ弁で、熱負荷の変動が大きい装置に適している。","ok":false,"why":"定圧自動膨張弁は負荷変動に追従できないため、負荷変動の小さい小形装置に用いる。"},{"k":"ニ","t":"温度自動膨張弁の感温筒は、蒸発器出口の吸込み管の水平部分に密着させて取り付け、油が溜まる管の底部には取り付けない。","ok":true,"why":"感温筒は水平吸込み管の上部又は側面に密着させる。底部は油の影響で正しい温度を検出できない。"}],"opts":[[0,2],[2,3],[0,1,2],[0,1,3],[1,2,3]],"ans":3},{"id":"S08-2","levels":["3"],"subject":"safety","slot":8,"stem":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。","statements":[{"k":"イ","t":"高圧圧力スイッチは、吐出し圧力が異常に上昇したとき圧縮機を停止させる安全装置で、原則として手動復帰式とする。","ok":true,"why":"高圧遮断装置は原因を確認して復帰させるため手動復帰が原則。可燃性・毒性冷媒では手動復帰が必須。"},{"k":"ロ","t":"蒸発圧力調整弁は蒸発器出口に取り付け、蒸発圧力が設定値より低くならないように制御して、水冷却器の凍結防止などに用いる。","ok":true,"why":"蒸発圧力調整弁は蒸発圧力の下限を保つ。吸入圧力調整弁（上限制御）と混同しないこと。"},{"k":"ハ","t":"吸入圧力調整弁は、圧縮機の吸込み圧力が設定値以上に上がらないように制御し、始動時などの電動機の過負荷を防止する。","ok":true,"why":"吸込み圧力の上限を制限して圧縮機用電動機の過負荷を防ぐ。"},{"k":"ニ","t":"キャピラリチューブは、蒸発器出口の過熱度を検出して冷媒流量を調節する絞り機構である。","ok":false,"why":"キャピラリチューブは細管の流動抵抗で絞り膨張するだけで、過熱度制御の機能はない。小形装置に使われる。"}],"opts":[[0,1],[1,2],[2,3],[0,1,2],[0,1,3]],"ans":3},{"id":"S09-1","levels":["3"],"subject":"safety","slot":9,"stem":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。","statements":[{"k":"イ","t":"高圧受液器は、運転状態の変化による冷媒液量の変動を吸収し、修理の際に冷媒を回収するためにも用いられる。","ok":true,"why":"高圧受液器は凝縮器出口の液を貯え、液量変動の吸収とポンプダウン時の冷媒回収に使う。"},{"k":"ロ","t":"液分離器は、蒸発器と圧縮機の間の吸込み配管に設け、冷媒液が圧縮機に戻るのを防止する。","ok":true,"why":"液分離器（アキュムレータ）は吸込み配管に設ける。吐出し配管に設けるのは油分離器。"},{"k":"ハ","t":"油分離器は圧縮機の吸込み配管に設け、吸込み蒸気中の油を分離してクランクケースに戻す。","ok":false,"why":"油分離器は吐出し配管に設け、吐出しガスに混じった油を分離して圧縮機に戻す。"},{"k":"ニ","t":"液ガス熱交換器は、凝縮器出口の冷媒液を過冷却するとともに圧縮機吸込み蒸気を過熱させるもので、アンモニア冷凍装置に広く用いられる。","ok":false,"why":"液ガス熱交換器はフルオロカーボン装置用。アンモニアは吐出しガス温度が高くなりすぎるため使用しない。"}],"opts":[[0,1],[1,3],[0,1,3],[0,2,3],[1,2,3]],"ans":0},{"id":"S09-2","levels":["3"],"subject":"safety","slot":9,"stem":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。","statements":[{"k":"イ","t":"フィルタドライヤは、フルオロカーボン冷凍装置の液配管に設け、乾燥剤で冷媒中の水分を除去する。","ok":true,"why":"水分による膨張弁の氷結や酸生成を防ぐため、高圧液配管に設ける。"},{"k":"ロ","t":"フィルタドライヤの乾燥剤には、シリカゲルや合成ゼオライトなど、水分を吸着し、砕けにくいものが用いられる。","ok":true,"why":"乾燥剤は物理的に水分を「吸着」する。化学変化で除去するのではない。"},{"k":"ハ","t":"サイトグラスは液配管に設け、冷媒液中の気泡の有無から冷媒充塡量の適否を確認するのに用いる。","ok":true,"why":"運転中に気泡が見えれば冷媒不足やフラッシュガス発生の疑い。モイスチャーインジケータ付きなら水分も確認できる。"},{"k":"ニ","t":"低圧受液器は、凝縮器で凝縮した冷媒液を一時貯留するために凝縮器の出口側に設ける。","ok":false,"why":"凝縮器出口に設けるのは高圧受液器。低圧受液器は冷媒液強制循環式装置で蒸発器に液を送るための液溜め兼液分離器。"}],"opts":[[0,1],[0,3],[0,1,2],[0,1,3],[1,2,3]],"ans":2},{"id":"S10-1","levels":["3"],"subject":"safety","slot":10,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。","statements":[{"k":"イ","t":"配管用炭素鋼鋼管（SGP）は、設計圧力が1MPaを超える耐圧部分や、温度が−25℃より低い低温配管には使用しない。","ok":true,"why":"SGPは低温脆性と強度の面で制限があり、高圧・低温の冷媒配管にはSTPG（圧力配管用炭素鋼鋼管）などを使う。"},{"k":"ロ","t":"圧縮機の吸込み蒸気配管の横走り管は、圧縮機に向かって上り勾配とし、途中にUトラップを設けて油を溜める。","ok":false,"why":"横走り吸込み管は圧縮機に向かって下り勾配とし、油や液が溜まるUトラップは避ける。溜まった液は再始動時の液圧縮の原因。"},{"k":"ハ","t":"吐出しガス配管では、油を凝縮器へ確実に運ぶため所定以上の流速を確保するが、過大な流速は騒音や圧力損失の原因となる。","ok":true,"why":"横走り管3.5m/s以上、立ち上がり管6m/s以上を確保し、25m/sを超えないようにする。"},{"k":"ニ","t":"フルオロカーボン冷凍装置の銅配管をろう付けするときは、管内に窒素ガスを流して酸化皮膜の生成を防ぐ。","ok":true,"why":"ろう付け時に管内に窒素を流すと酸化スケールの発生を防げる。スケールは膨張弁の詰まりや圧縮機故障の原因になる。"}],"opts":[[0,2],[2,3],[0,1,2],[0,2,3],[1,2,3]],"ans":3},{"id":"S10-2","levels":["3"],"subject":"safety","slot":10,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。","statements":[{"k":"イ","t":"高圧液配管は、フラッシュガスの発生を防ぐため、圧力降下が小さくなるように管径を選定し、必要に応じて液を過冷却する。","ok":true,"why":"液配管の圧力降下や温度上昇でフラッシュガスが発生すると膨張弁容量が不足する。流速は小さめにとる。"},{"k":"ロ","t":"吸込み蒸気配管の圧力降下が大きくなると、圧縮機の吸込み圧力が低下して冷凍能力が減少する。","ok":true,"why":"吸込み圧力の低下は比体積を増やし冷媒循環量を減らす。圧力降下は蒸発温度換算で2K以内が目安。"},{"k":"ハ","t":"アンモニア冷凍装置の配管には、銅管及び銅合金製の継手を用いる。","ok":false,"why":"アンモニアは銅・銅合金を腐食するため、鋼管を用いる。"},{"k":"ニ","t":"容量制御装置をもつ圧縮機の吸込み立ち上がり管では、軽負荷時にも油を戻すため二重立ち上がり管を用いることがある。","ok":true,"why":"軽負荷時は細い管で流速を確保し、全負荷時は両方の管を使う。油戻しに必要な最小流速を保つための配管。"}],"opts":[[0,1],[0,3],[1,3],[0,1,3],[1,2,3]],"ans":3},{"id":"S11-1","levels":["3"],"subject":"safety","slot":11,"stem":"次のイ、ロ、ハ、ニの記述のうち、安全装置について正しいものはどれか。","statements":[{"k":"イ","t":"圧縮機用安全弁の最小口径は、ピストン押しのけ量の平方根に比例し、冷媒の種類によって定められた定数を用いて求める。","ok":true,"why":"d1＝C1√V。定数 C1 は冷媒の種類によって異なる。「冷媒の種類に依存しない」は誤り。"},{"k":"ロ","t":"圧力容器用安全弁の最小口径は、容器の内容積の平方根に比例する。","ok":false,"why":"圧力容器用安全弁の最小口径は d3＝C3√(DL)。容器の外径 D と長さ L の積の平方根に比例する。"},{"k":"ハ","t":"溶栓は、可燃性ガスや毒性ガスを冷媒とする冷凍装置の圧力容器にも使用できる。","ok":false,"why":"溶栓は作動すると冷媒を大気に放出するため、可燃性・毒性ガスの装置には使用できない。"},{"k":"ニ","t":"破裂板は、一度作動すると再使用できないので、可燃性ガスや毒性ガスを冷媒とする装置には使用しない。","ok":true,"why":"破裂板は作動後に全量放出するため、不活性ガス以外の冷媒には使用しない。"}],"opts":[[0,3],[1,3],[2,3],[0,2,3],[1,2,3]],"ans":0},{"id":"S11-2","levels":["3"],"subject":"safety","slot":11,"stem":"次のイ、ロ、ハ、ニの記述のうち、安全装置について正しいものはどれか。","statements":[{"k":"イ","t":"液封は、液で満たされた配管などの両端が止め弁などで閉じられた状態をいい、温度上昇により著しい圧力上昇を生じて破壊の原因となる。","ok":true,"why":"液は熱膨張しても逃げ場がないため、わずかな温度上昇で配管や弁が破裂するほどの圧力になる。"},{"k":"ロ","t":"液封による事故を防ぐため、液封のおそれのある部分には安全弁や破裂板を取り付けるが、溶栓は液封防止には使用できない。","ok":true,"why":"溶栓は温度で作動する装置なので、液温が低いまま圧力が上がる液封には対応できない。"},{"k":"ハ","t":"溶栓は、原則として75℃以下で溶融するものを用い、圧縮機の吐出しガスの影響を受ける場所に取り付ける。","ok":false,"why":"溶融温度75℃以下は正しいが、吐出しガスの熱で誤作動しないよう、吐出しガスの影響を受けない場所に取り付ける。"},{"k":"ニ","t":"高圧遮断装置は、安全弁の吹始め圧力以下の圧力で圧縮機を停止させるように設定する。","ok":true,"why":"安全弁が吹く前に圧縮機を止めて圧力上昇を抑えるため、高圧遮断装置の設定圧力は安全弁吹始め圧力の最低値以下、かつ許容圧力以下とする。"}],"opts":[[0,2],[1,3],[0,1,2],[0,1,3],[0,2,3]],"ans":3},{"id":"S12-1","levels":["3"],"subject":"safety","slot":12,"stem":"次のイ、ロ、ハ、ニの記述のうち、材料の強さ及び圧力容器について正しいものはどれか。","statements":[{"k":"イ","t":"円筒胴に内圧が作用するとき、胴板に生じる接線方向（円周方向）の引張応力は、長手方向の引張応力の2倍になる。","ok":true,"why":"接線方向応力 σt＝PD／(2t)、長手方向応力 σl＝PD／(4t)。接線方向が2倍で、板厚計算はこちらで行う。"},{"k":"ロ","t":"許容引張応力は、一般の鋼材では材料の最小引張強さの4分の1としている。","ok":true,"why":"安全率4をとり、許容引張応力＝最小引張強さ／4。"},{"k":"ハ","t":"応力－ひずみ線図において、荷重を取り除いたときにひずみが残らない限界を比例限度といい、比例限度は弾性限度より大きい。","ok":false,"why":"ひずみが残らない限界は弾性限度。応力とひずみが比例する限界が比例限度で、比例限度＜弾性限度の関係にある。"},{"k":"ニ","t":"腐れしろは、材料の腐食を考慮して板厚に加える余裕で、鋼材では通常1mmとする。","ok":true,"why":"鋼は1mm、銅・銅合金は0.2mmが標準的な腐れしろ。"}],"opts":[[0,1],[0,3],[1,3],[0,1,3],[1,2,3]],"ans":3},{"id":"S12-2","levels":["3"],"subject":"safety","slot":12,"stem":"次のイ、ロ、ハ、ニの記述のうち、材料の強さ及び圧力容器について正しいものはどれか。","statements":[{"k":"イ","t":"冷媒設備の高圧部の設計圧力は、冷媒の種類と基準凝縮温度に応じて定められ、通常の運転状態で起こりうる最高の圧力を基準とする。","ok":true,"why":"高圧部設計圧力は基準凝縮温度（43、50、55、60、65℃）に対応する飽和圧力を基に冷媒ごとに定められる。"},{"k":"ロ","t":"円筒胴の必要板厚を求める計算には、設計圧力、胴の内径、材料の許容引張応力、溶接継手の効率及び腐れしろが用いられる。","ok":true,"why":"t＝PDi／(2σaη−1.2P)＋α。設計圧力 P、内径 Di、許容引張応力 σa、溶接効率 η、腐れしろ α。"},{"k":"ハ","t":"さら形鏡板は半球形鏡板に比べて発生する応力が小さいので、同じ条件では板厚を薄くできる。","ok":false,"why":"応力が最も小さいのは半球形。さら形は隅の丸み部に応力集中が生じるため、形状係数を考慮して厚くする必要がある。"},{"k":"ニ","t":"低温脆性による破壊は、降伏点を超える大きな荷重が作用したときにのみ発生する。","ok":false,"why":"低温脆性による破壊は、衝撃荷重などが引き金となって降伏点以下の低い荷重でも突発的に起こる。"}],"opts":[[0,1],[0,2],[0,3],[1,2],[1,3]],"ans":0},{"id":"S13-1","levels":["3"],"subject":"safety","slot":13,"stem":"次のイ、ロ、ハ、ニの記述のうち、据付け及び試験について正しいものはどれか。","statements":[{"k":"イ","t":"冷凍装置の試験は、耐圧試験、気密試験、真空試験の順に行い、その後に冷媒を充塡して試運転を行う。","ok":true,"why":"耐圧試験（機器単体）→気密試験（組立後）→真空試験→冷媒充塡→試運転の順。順序を逆にした記述は誤り。"},{"k":"ロ","t":"気密試験には、空気や窒素などの気体を用い、酸素や可燃性ガスは使用しない。","ok":true,"why":"酸素は油と反応して爆発の危険があり、可燃性ガス・毒性ガスも使用しない。"},{"k":"ハ","t":"アンモニア冷凍装置の気密試験には、二酸化炭素を使用する。","ok":false,"why":"二酸化炭素はアンモニアと反応して炭酸アンモニウムの粉末を生じるため使用できない。窒素などを用いる。"},{"k":"ニ","t":"耐圧試験は原則として水などの液体で行い、圧力容器の材料に生じる応力が降伏点を超えないようにする。","ok":true,"why":"液圧で行うのが原則。試験圧力で材料が永久変形しないよう、発生応力は降伏点以下でなければならない。"}],"opts":[[0,1],[0,2],[0,3],[2,3],[0,1,3]],"ans":4},{"id":"S13-2","levels":["3"],"subject":"safety","slot":13,"stem":"次のイ、ロ、ハ、ニの記述のうち、据付け及び試験について正しいものはどれか。","statements":[{"k":"イ","t":"真空試験は、装置全体を真空にして放置し、圧力上昇の有無から微量の漏れを確認する試験であるが、漏れの箇所を特定することはできない。","ok":true,"why":"真空試験は気密の最終確認と水分除去が目的。漏れの有無は分かるが箇所は特定できない。"},{"k":"ロ","t":"多気筒圧縮機の基礎の質量は、圧縮機の質量と同程度とすればよい。","ok":false,"why":"多気筒圧縮機は負荷変動と振動が大きいため、基礎の質量は圧縮機質量の2〜3倍程度とする。"},{"k":"ハ","t":"気密試験で漏れが見つかった場合は、加圧したまま漏れ箇所を補修してよい。","ok":false,"why":"補修は圧力を大気圧まで下げてから行い、補修後に再度規定圧力まで加圧して確認する。加圧状態での衝撃や補修は危険。"},{"k":"ニ","t":"冷媒の充塡量が不足すると冷凍能力が低下するが、過充塡は凝縮圧力の上昇や液圧縮の原因となるので、適正量を充塡する。","ok":true,"why":"受液器をもつ装置でも、負荷変動で不足しない量を充塡しつつ過充塡にならないようにする。"}],"opts":[[0,2],[0,3],[1,2],[1,3],[0,1,3]],"ans":1},{"id":"S14-1","levels":["3"],"subject":"safety","slot":14,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。","statements":[{"k":"イ","t":"運転開始前には、圧縮機の油量、各弁の開閉状態、冷却水の通水などを点検し、吐出し側の止め弁が閉じたまま始動しないよう確認する。","ok":true,"why":"吐出し止め弁閉のまま始動すると急激な圧力上昇で危険。始動前点検の基本項目。"},{"k":"ロ","t":"圧縮機の始動時は、吸込み止め弁を徐々に開き、液戻りが起こらないようにする。","ok":true,"why":"急に全開すると蒸発器内の液が圧縮機に戻り液圧縮の危険がある。"},{"k":"ハ","t":"冷凍装置を停止するときは、まず圧縮機を停止し、その後に凝縮器の冷却水を止め、最後に受液器出口の液止め弁を閉じる。","ok":false,"why":"正しい順序は、受液器出口液止め弁を閉じて低圧側の冷媒を回収（ポンプダウン）→圧縮機停止→冷却水停止。"},{"k":"ニ","t":"長期間運転を休止するときは、低圧側の冷媒を受液器に回収し、安全弁の元弁を除く各部の止め弁を閉じる。","ok":true,"why":"安全弁の元弁は休止中も開けておく。「安全弁の元弁も閉じる」は誤り。"}],"opts":[[0,1],[1,3],[0,1,2],[0,1,3],[1,2,3]],"ans":3},{"id":"S14-2","levels":["3"],"subject":"safety","slot":14,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。","statements":[{"k":"イ","t":"凝縮圧力が一定のまま蒸発圧力が低下すると、圧縮機の体積効率は低下し、冷凍能力も減少する。","ok":true,"why":"圧力比の増大で体積効率が低下し、吸込み蒸気の比体積増大で冷媒循環量が減るため冷凍能力は減少する。"},{"k":"ロ","t":"水冷凝縮器の運転中、凝縮温度が冷却水出口温度より3〜5K程度高い状態であれば正常と判断できる。","ok":true,"why":"凝縮温度と冷却水出口温度の差3〜5K、冷却水の出入口温度差4〜6K程度が正常運転の目安。"},{"k":"ハ","t":"吐出しガス温度が異常に高い状態で運転を続けると、冷凍機油が劣化して圧縮機の潤滑に支障を生じる。","ok":true,"why":"高温で油は分解・炭化し、潤滑不良や弁の固着を招く。"},{"k":"ニ","t":"冬季に冷却水温度が下がって凝縮圧力が低くなりすぎても、膨張弁の容量は過大になるだけで運転に支障はないので、凝縮圧力調整弁は不要である。","ok":false,"why":"凝縮圧力が低すぎると膨張弁前後の圧力差が減って弁容量が不足し、冷媒流量不足による能力低下や過熱運転になる。凝縮圧力調整弁などで凝縮圧力を保つ。"}],"opts":[[0,3],[2,3],[0,1,2],[0,1,3],[0,2,3]],"ans":2},{"id":"S15-1","levels":["3"],"subject":"safety","slot":15,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"冷媒の充塡量が不足すると、蒸発圧力と凝縮圧力がともに低下し、吸込み蒸気の過熱度が大きくなって吐出しガス温度が上昇する。","ok":true,"why":"冷媒不足では吐出しガス「圧力」は低下し「温度」は上昇する。圧力と温度がともに上昇するのは不凝縮ガス混入の場合。"},{"k":"ロ","t":"不凝縮ガスの有無は、装置を停止して凝縮器に冷却水を通し続け、凝縮器内の圧力が冷却水温度に相当する冷媒の飽和圧力より高いかどうかで確認する。","ok":true,"why":"冷媒が冷却水温度まで冷えても圧力が飽和圧力より高ければ、その差圧分が不凝縮ガスの分圧。"},{"k":"ハ","t":"フルオロカーボン冷凍装置に水分が侵入しても、水分は冷媒によく溶けるので運転に影響しない。","ok":false,"why":"フルオロカーボンは水をほとんど溶かさない。遊離水分は膨張弁で氷結し、冷媒の加水分解で酸を生じる。"},{"k":"ニ","t":"オイルフォーミングとは、クランクケース内の油に溶け込んだ冷媒が始動時の圧力低下で急激に蒸発し、油が泡立つ現象をいう。","ok":true,"why":"冷媒が油に「混入すること」自体ではなく、溶け込んだ冷媒が蒸発して泡立つ現象。油上がりや油圧低下の原因になる。"}],"opts":[[0,2],[0,3],[1,2],[2,3],[0,1,3]],"ans":4},{"id":"S15-2","levels":["3"],"subject":"safety","slot":15,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"液戻り（液圧縮）の原因には、膨張弁の開きすぎ、感温筒の取付け不良、蒸発器の着霜やファン停止による負荷の急変などがある。","ok":true,"why":"蒸発器で蒸発しきれなかった液が圧縮機に戻る。感温筒が外れると膨張弁は開きすぎる。"},{"k":"ロ","t":"圧縮機の吐出し弁に漏れがあると、吐出しガスの一部がシリンダに戻って再圧縮され、吐出しガス温度が上昇する。","ok":true,"why":"弁漏れによる再圧縮は吐出しガス温度上昇と吐出量減少を招く。吸込み弁漏れも吐出量減少の原因。"},{"k":"ハ","t":"アンモニア冷凍装置の漏えい箇所の点検には、硫黄を燃やした白煙やフェノールフタレイン紙などが用いられる。","ok":true,"why":"アンモニアはアルカリ性で、硫黄の煙と反応して白煙を生じ、フェノールフタレイン紙を赤く変色させる。"},{"k":"ニ","t":"火炎の色の変化で漏えいを検知するハライドトーチは、アンモニアの漏えい検知に用いる。","ok":false,"why":"ハライドトーチはフルオロカーボン（ハロゲン化合物）用。炎が緑色に変わる。アンモニアには使えない。"}],"opts":[[0,3],[1,3],[0,1,2],[0,1,3],[1,2,3]],"ans":2},{"id":"P01-1","levels":["2"],"subject":"safety","slot":1,"stem":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の過熱運転（吐出しガス温度の異常上昇）の原因や現象について正しいものはどれか。","statements":[{"k":"イ","t":"蒸発器の熱負荷が減少して温度自動膨張弁が絞られると、吸込み蒸気の過熱度が増大し、吐出しガス温度が上昇する。","ok":true,"why":"負荷減少で冷媒流量が減り過熱度が大きくなると、圧縮後の吐出しガス温度も高くなる。"},{"k":"ロ","t":"冬季に凝縮圧力が低下しすぎると、膨張弁の容量が不足して冷媒流量が減り、過熱運転になることがある。","ok":true,"why":"膨張弁前後の圧力差が小さくなると弁容量が不足し、蒸発器出口の過熱度が過大になる。凝縮圧力調整弁などで対処する。"},{"k":"ハ","t":"蒸発器から液が戻る湿り運転になると、吐出しガス温度は異常に上昇する。","ok":false,"why":"液戻りでは吐出しガス温度は低下する。上昇するのは過熱運転（乾き運転）のとき。"},{"k":"ニ","t":"圧縮機の吸込み弁に漏れがあると、圧縮されたガスの一部が吸込み側へ逆流して吸込み蒸気を加熱するため、吐出しガス温度が上昇し吐出量も減少する。","ok":true,"why":"吸込み弁漏れは再圧縮による吐出しガス温度上昇と吐出量減少の原因。"}],"opts":[[0,1],[1,3],[0,1,3],[0,2,3],[1,2,3]],"ans":2},{"id":"P01-2","levels":["2"],"subject":"safety","slot":1,"stem":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の異常運転について正しいものはどれか。","statements":[{"k":"イ","t":"過熱運転を防ぐには、圧縮機の吸込み蒸気の過熱度をできるだけ大きく保つとよい。","ok":false,"why":"過熱度の増大は吐出しガス温度をさらに上げる。適切な過熱度（3〜8K程度）を保つのが対策。"},{"k":"ロ","t":"圧力比が大きくなると吐出しガス温度が上昇し、冷凍機油の劣化や炭化を招く。","ok":true,"why":"圧力比の増大は圧縮仕事と吐出しガス温度を高める。油の分解温度を超えると潤滑不良につながる。"},{"k":"ハ","t":"アンモニアの吐出しガス温度はフルオロカーボンより高くなるため、アンモニア圧縮機ではシリンダヘッドを水冷することがある。","ok":true,"why":"アンモニアは比熱比が大きく圧縮後の温度が高い。水冷ジャケットで吐出し温度と油温を抑える。"},{"k":"ニ","t":"冷媒充塡量の不足は、蒸発圧力の低下と過熱度の増大を招き、過熱運転の原因になる。","ok":true,"why":"冷媒不足では蒸発器で液が早く蒸発し尽くし、吸込み蒸気の過熱度が大きくなる。"}],"opts":[[1,2],[0,1,2],[0,1,3],[0,2,3],[1,2,3]],"ans":4},{"id":"P02-1","levels":["2"],"subject":"safety","slot":2,"stem":"次のイ、ロ、ハ、ニの記述のうち、凝縮器の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"水冷凝縮器の冷却水量が減少すると、冷却水の出入口温度差が大きくなり、凝縮圧力が上昇する。","ok":true,"why":"水量減少で水温上昇が大きくなり、必要な温度差を得るため凝縮温度・圧力が上がる。"},{"k":"ロ","t":"冷却管に水あかが付着すると汚れ係数が増して熱通過率が低下し凝縮圧力が上昇するので、定期的に洗浄する。","ok":true,"why":"水あかは熱伝導率が小さい。ブラシ洗浄や薬品洗浄で除去する。"},{"k":"ハ","t":"不凝縮ガスが混入すると凝縮圧力と吐出しガス温度が上昇する。混入の有無は、装置停止後に冷却水を通し続け、凝縮器内圧力が冷却水温度相当の飽和圧力より高いかどうかで確認する。","ok":true,"why":"差圧分が不凝縮ガスの分圧。確認後は凝縮器上部から放出する（アンモニアは除害して放出）。"},{"k":"ニ","t":"冷媒を過充塡すると凝縮器内に液が溜まって凝縮圧力が上昇し、凝縮器出口液の過冷却度は小さくなる。","ok":false,"why":"過充塡では液に接する伝熱面が増えるため、凝縮圧力は上昇し過冷却度は大きくなる。"}],"opts":[[0,1],[1,3],[2,3],[0,1,2],[1,2,3]],"ans":3},{"id":"P02-2","levels":["2"],"subject":"safety","slot":2,"stem":"次のイ、ロ、ハ、ニの記述のうち、凝縮器及び冷却塔の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"空冷凝縮器のフィンが目詰まりすると風量が減少し、凝縮圧力が上昇するので、定期的に清掃する。","ok":true,"why":"空気側の風量減少は伝熱量を減らし凝縮温度を上げる。"},{"k":"ロ","t":"冷却塔の補給水量は、蒸発、飛散及びブローダウンの分として循環水量の20%程度が必要である。","ok":false,"why":"補給水量は循環水量の2%程度が目安。"},{"k":"ハ","t":"冷却塔のアプローチとは、冷却塔出口水温と入口空気の湿球温度の差で、通常5K程度である。","ok":true,"why":"アプローチ約5K、クーリングレンジ（出入口水温差）約5Kが標準的な設計値。"},{"k":"ニ","t":"同じ凝縮器で冷凍負荷が一定なら、冷却水の入口温度が高いほど凝縮温度は低くなる。","ok":false,"why":"冷却水温が高いほど凝縮温度は高くなる。"}],"opts":[[0,2],[0,3],[1,3],[2,3],[1,2,3]],"ans":0},{"id":"P03-1","levels":["2"],"subject":"safety","slot":3,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の低圧部の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"吸込み圧力が低下すると蒸発器での液の蒸発が進みやすくなるため、圧縮機への液戻りが増える。","ok":false,"why":"吸込み圧力低下は冷媒不足や着霜などが原因で、過熱運転側の現象。液戻りは負荷急変や膨張弁の開きすぎで起こる。"},{"k":"ロ","t":"空気冷却器に霜が厚く付くと風量と熱通過率が低下し、蒸発圧力と圧縮機の吸込み圧力が低下する。","ok":true,"why":"着霜は伝熱を妨げ蒸発温度を下げる。早めの除霜が必要。"},{"k":"ハ","t":"蒸発器に冷凍機油が溜まって圧縮機に戻らないと、伝熱が悪化して蒸発圧力が低下し、圧縮機の油量も不足する。","ok":true,"why":"油戻り不良は油膜による伝熱低下と圧縮機の潤滑不足を同時に招く。"},{"k":"ニ","t":"アンモニア用満液式蒸発器では、油はアンモニア液より重く底部に溜まるので、油抜き弁から定期的に抜き取る。","ok":true,"why":"鉱油はアンモニア液より重い。フルオロカーボンは油と溶け合うため油戻し装置で戻す。"}],"opts":[[0,1],[0,2],[0,3],[0,1,2],[1,2,3]],"ans":4},{"id":"P03-2","levels":["2"],"subject":"safety","slot":3,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の低圧部の保守管理について正しいものはどれか。","statements":[{"k":"イ","t":"水やブラインの冷却器では、蒸発圧力が低下しすぎると管内の水が凍結して管を破損することがあるので、蒸発圧力調整弁や低圧遮断装置で防止する。","ok":true,"why":"凍結防止には蒸発圧力の下限維持、断水リレー（フロースイッチ）による圧縮機停止が有効。"},{"k":"ロ","t":"液分離器で分離した冷媒液は、そのまま圧縮機の吸込み側へ戻して処理する。","ok":false,"why":"分離液を圧縮機へ戻せば液圧縮になる。蒸発器や受液器へ戻すか、加熱して蒸発させる。"},{"k":"ハ","t":"液戻りの原因には、膨張弁の開度過大、感温筒の取付け不良、蒸発器ファンの停止による負荷急変などがある。","ok":true,"why":"蒸発器で蒸発しきれない液が圧縮機へ戻る。"},{"k":"ニ","t":"冷蔵庫では蒸発温度が低すぎると冷却器への着霜が増え、貯蔵品の乾燥も進む。","ok":true,"why":"蒸発温度と庫内温度の差が大きいほど除湿が進み着霜と乾燥が増える。冷蔵では温度差を小さめにとる。"}],"opts":[[0,1],[1,3],[0,1,3],[0,2,3],[1,2,3]],"ans":3},{"id":"P04-1","levels":["2"],"subject":"safety","slot":4,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒について正しいものはどれか。","statements":[{"k":"イ","t":"R32は微燃性をもち、高圧ガス保安法では特定不活性ガスとして取り扱われる。","ok":true,"why":"R32、R1234yf、R1234zeなどが特定不活性ガス。移動時の書面交付や漏えい検知警報の対象になる。"},{"k":"ロ","t":"非共沸混合冷媒は、一定圧力の下で蒸発・凝縮するときに温度が変化する温度勾配をもつ。","ok":true,"why":"露点と沸点が異なる。R407C、R404Aなどが代表例。"},{"k":"ハ","t":"R1234yfはHFO冷媒で、地球温暖化係数（GWP）がHFC冷媒より著しく小さい。","ok":true,"why":"HFO（ハイドロフルオロオレフィン）は大気寿命が短くGWPが1桁程度。"},{"k":"ニ","t":"HFC冷媒は塩素を含まないが、オゾン層破壊係数（ODP）は0ではない。","ok":false,"why":"塩素を含まないHFCのODPは0。ODPをもつのはHCFC（R22など）やCFC。"}],"opts":[[0,1],[2,3],[0,1,2],[0,2,3],[1,2,3]],"ans":2},{"id":"P04-2","levels":["2"],"subject":"safety","slot":4,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒及び冷凍機油について正しいものはどれか。","statements":[{"k":"イ","t":"HFC冷媒は鉱油と溶け合わないため、ポリオールエステル油（POE）などの合成油を用いる。","ok":true,"why":"相溶性がないと油が蒸発器に溜まり戻らない。HFCには合成油を使う。"},{"k":"ロ","t":"ポリオールエステル油は水分を吸収しにくいので、鉱油に比べて水分管理は緩やかでよい。","ok":false,"why":"POEは吸湿性が高く加水分解しやすい。開封後の保管や真空乾燥に特に注意が必要。"},{"k":"ハ","t":"フルオロカーボン装置に水分が混入し油が劣化すると、銅管から溶け出した銅が鉄部に析出する銅めっき現象が起こることがある。","ok":true,"why":"銅めっきは軸受やピストンのすきまを狭め、焼付きの原因になる。"},{"k":"ニ","t":"アンモニアは鉱油によく溶けるので、油は系統内を循環しやすい。","ok":false,"why":"アンモニアは鉱油にほとんど溶けない。油は分離して底部に溜まるため油抜きが必要。"}],"opts":[[0,2],[1,2],[1,3],[0,1,2],[0,2,3]],"ans":0},{"id":"P05-1","levels":["2"],"subject":"safety","slot":5,"stem":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。","statements":[{"k":"イ","t":"ガスチャージ方式の温度自動膨張弁では、受圧部（ダイアフラム）の温度が感温筒の温度より高くなければ正常に作動しない。","ok":true,"why":"受圧部が冷えるとチャージ媒体がそこで凝縮し感温筒の温度を検出できなくなる。制限チャージとも呼ばれる。"},{"k":"ロ","t":"電子膨張弁はステッピングモータなどで弁を駆動し、温度センサの信号により過熱度などを精密に制御できる。","ok":true,"why":"広い負荷範囲で安定した制御ができ、インバータ機に多用される。"},{"k":"ハ","t":"定圧自動膨張弁は蒸発圧力を一定に保つので、熱負荷変動の大きい装置に適している。","ok":false,"why":"負荷変動に追従できないため、負荷変動の小さい小形装置に用いる。"},{"k":"ニ","t":"蒸発圧力調整弁は蒸発器出口に取り付け、蒸発圧力が設定値以下に下がらないようにして水の凍結などを防ぐ。","ok":true,"why":"蒸発圧力の下限を保つ弁。吸入圧力調整弁は圧縮機吸込み圧力の上限を制限する。"}],"opts":[[0,2],[1,2],[2,3],[0,1,3],[0,2,3]],"ans":3},{"id":"P05-2","levels":["2"],"subject":"safety","slot":5,"stem":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器及び保安装置について正しいものはどれか。","statements":[{"k":"イ","t":"高圧遮断装置は、異常高圧の原因を確認せずに再始動できるように自動復帰式とするのが原則である。","ok":false,"why":"高圧遮断装置は手動復帰が原則。可燃性・毒性ガスの装置では手動復帰でなければならない。"},{"k":"ロ","t":"油圧保護圧力スイッチは、給油圧力（油圧とクランクケース圧力の差）が低下したとき、一定時間後に圧縮機を停止させる。","ok":true,"why":"始動直後の油圧確立の遅れを考慮し、60〜90秒程度のタイマを内蔵する。手動復帰式。"},{"k":"ハ","t":"凝縮圧力調整弁は、冬季など外気温度が低いときに凝縮圧力が下がりすぎないようにするために用いる。","ok":true,"why":"凝縮圧力の低下による膨張弁容量不足を防ぐ。"},{"k":"ニ","t":"直動式電磁弁は大容量の配管に適し、パイロット式電磁弁は小容量に用いる。","ok":false,"why":"逆。直動式は小容量、大容量には冷媒の圧力差で主弁を開くパイロット式を用いる。"}],"opts":[[0,1],[0,3],[1,2],[0,1,3],[1,2,3]],"ans":2},{"id":"P06-1","levels":["2"],"subject":"safety","slot":6,"stem":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。","statements":[{"k":"イ","t":"高圧受液器は、出口の冷媒液に蒸気が混入しないよう、液面より下から液を取り出す構造とする。","ok":true,"why":"蒸気が液配管に入ると膨張弁の容量不足を招く。運転中は受液器内に必ず液面を保つ。"},{"k":"ロ","t":"油分離器は、アンモニア装置や大形・低温のフルオロカーボン装置で用いられ、小形のフルオロカーボン装置では省略されることがある。","ok":true,"why":"油分離器は吐出し配管に設置し、分離した油を圧縮機へ戻す。"},{"k":"ハ","t":"液分離器は蒸発器と圧縮機の間の吸込み配管に設け、蒸気の流速を下げて液を分離する。","ok":true,"why":"液戻りによる液圧縮を防ぐ。負荷変動の大きい装置や満液式蒸発器で使う。"},{"k":"ニ","t":"液ガス熱交換器は、吐出しガス温度が高いアンモニア装置に特に広く用いられる。","ok":false,"why":"液ガス熱交換器はフルオロカーボン装置用。アンモニアでは吸込み蒸気の過熱で吐出し温度が過大になるため使わない。"}],"opts":[[0,1],[0,3],[1,2],[0,1,2],[0,1,3]],"ans":3},{"id":"P06-2","levels":["2"],"subject":"safety","slot":6,"stem":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。","statements":[{"k":"イ","t":"低圧受液器は冷媒液強制循環式装置で用いられ、液ポンプで蒸発器へ送る液を貯え、蒸発器からの戻り冷媒の液と蒸気を分離する。","ok":true,"why":"液面制御装置で液面を一定に保ち、液ポンプのキャビテーションを防ぐ。"},{"k":"ロ","t":"フィルタドライヤの乾燥剤は、冷媒中の水分と化学反応して水分を固定する。","ok":false,"why":"シリカゲルや合成ゼオライトは水分を物理的に吸着する。化学変化ではない。"},{"k":"ハ","t":"サイトグラスは液配管に設け、気泡の有無による充塡量の確認や、モイスチャーインジケータによる水分の確認に用いる。","ok":true,"why":"インジケータの色変化で水分量の目安が分かる。"},{"k":"ニ","t":"不凝縮ガス分離器（ガスパージャ）は、凝縮器や受液器上部に溜まった不凝縮ガスを冷媒と分離して放出する。","ok":true,"why":"不凝縮ガスを冷却して冷媒を凝縮させ、空気などを放出する。大形装置に用いる。"}],"opts":[[0,2],[1,3],[0,1,2],[0,1,3],[0,2,3]],"ans":4},{"id":"P07-1","levels":["2"],"subject":"safety","slot":7,"stem":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。","statements":[{"k":"イ","t":"フルオロカーボン用銅配管のろう付けでは、管内に窒素を流して酸化皮膜の生成を防ぐ。","ok":true,"why":"酸化スケールは膨張弁の詰まりや圧縮機の摩耗の原因になる。" bject":"law","slot":19,"case":"B","stem":"次のイ、ロ、ハの記述のうち、この事業所の製造の方法に係る技術上の基準について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"高圧ガスの製造は、1日に1回以上、製造設備の属する製造施設の異常の有無を点検して行わなければならない。","ok":true,"why":"冷凍則第9条第2号。"},{"k":"ロ","t":"冷媒設備の安全弁に付帯して設けた止め弁は、安全弁の修理又は清掃のため特に必要な場合を除き、常に全開にしておかなければならない。","ok":true,"why":"冷凍則第9条第1号。"},{"k":"ハ","t":"冷媒設備の修理が終了したときは、その冷媒設備が正常に作動することを確認する前であっても、高圧ガスの製造を再開してよい。","ok":false,"why":"正常に作動することを確認した後でなければ製造をしてはならない。"}],"opts":[[0],[1],[0,1],[0,2],[1,2]],"ans":2},{"id":"C20-1","levels":["2"],"subject":"law","slot":20,"case":"B","stem":"次のイ、ロ、ハの記述のうち、この事業所の認定指定設備について冷凍保安規則上正しいものはどれか。","statements":[{"k":"イ","t":"この認定指定設備の冷媒設備は、その製造業者の事業所において脚上又は一つの架台上に一体に組み立てられたものである。","ok":true,"why":"冷凍則第57条の条件。使用場所に分割されずに搬入される。"},{"k":"ロ","t":"この認定指定設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものが使用されている。","ok":false,"why":"手動式のものを使用しないことが認定の条件。"},{"k":"ハ","t":"この認定指定設備を他の場所に移設した場合、変更の工事を施していなくても指定設備認定証が無効となることがある。","ok":true,"why":"冷凍則第62条。移設等は原則無効。指定設備認定機関等の調査を受け技術基準適合書の交付を受けた場合は例外。"}],"opts":[[2],[0,1],[0,2],[1,2],[0,1,2]],"ans":2},{"id":"L01-3","levels":["3","2"],"subject":"law","slot":1,"stem":"次のイ、ロ、ハの記述のうち、正しいものはどれか。","statements":[{"k":"イ","t":"温度35度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）は、現在の圧力が0.8メガパスカルであっても高圧ガスである。","ok":true,"why":"法第2条第1号後段。35度で1MPa以上となる圧縮ガスは現在の圧力にかかわらず高圧ガス。"},{"k":"ロ","t":"常用の温度において圧力が0.2メガパスカル以上となる液化ガスであって、現にその圧力が0.2メガパスカル以上であるものは高圧ガスである。","ok":true,"why":"法第2条第3号前段。"},{"k":"ハ","t":"温度35度において圧力が0.1メガパスカルとなる液化ガスは、高圧ガスである。","ok":false,"why":"液化ガスの基準は「圧力が0.2MPaとなる場合の温度が35度以下」。35度で0.1MPaにしかならないものは該当しない。"}],"opts":[[0],[1],[0,1],[0,2],[0,1,2]],"ans":2},{"id":"L01-4","levels":["3","2"],"subject":"law","slot":1,"stem":"次のイ、ロ、ハの記述のうち、正しいものはどれか。","statements":[{"k":"イ","t":"高圧ガス保安法は、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費を規制の対象としている。","ok":true,"why":"法第1条。「消費」も規制対象に含まれる。"},{"k":"ロ","t":"高圧ガス保安法は、容器の製造及び取扱も規制の対象としている。","ok":true,"why":"法第1条のとおり。"},{"k":"ハ","t":"圧縮アセチレンガスは、温度35度において圧力が0.2メガパスカル以上となるものが高圧ガスとされる。","ok":false,"why":"圧縮アセチレンガスの温度基準は15度（法第2条第2号）。35度は圧縮 function genVCOP(){

    id:"G-vcop", gen:"vcop", subject:"gakushiki", slot:2, levels:["2"],
    stem:"冷凍能力 Φo＝"+phio+" kW の往復圧縮機を用いた冷凍装置が、下記の条件で運転されている。この圧縮機のピストン押しのけ量 V（m³/h）と、この装置の実際の成績係数（COP）R の値の組合せとして、最も近いものはどれか。ただし、機械的摩擦損失仕事は冷媒に熱として加わらないものとする。",
    given: "圧縮機吸込み蒸気の比体積 v1＝"+fmt(v1,3)+" m³/kg、比エンタルピー h1＝"+h1+" kJ/kg／圧縮機吐出しガスの比エンタルピー（断熱圧縮後）h2＝"+h2+" kJ/kg／蒸発器入口の冷媒の比エンタルピー h4＝"+h4+" kJ/kg／体積効率 ηv＝"+fmt(ev,2)+"／断熱効率 ηc＝"+fmt(ec,2)+"／機械効率 ηm＝"+fmt(em,2),
    opts: pairs.map(function(p){ return "V＝"+fmt(p[0],0)+" m³/h、(COP)R＝"+fmt(p[1],2); }),
    ans: ansIdx,
    explain: "冷媒循環量 qmr＝Φo／(h1−h4)＝"+phio+"／("+h1+"−"+h4+")＝"+fmt(qmr,3)+" kg/s\nピストン押しのけ量 V＝qmr・v1×3600／ηv＝"+fmt(qmr,3)+"×"+fmt(v1,3)+"×3600／"+fmt(ev,2)+"＝"+fmt(V,0)+" m³/h\n理論断熱圧縮動力 Pth＝qmr(h2−h1)＝"+fmt(Pth,1)+" kW\n実際の軸動力 P＝Pth／(ηc・ηm)＝"+fmt(Pth,1)+"／("+fmt(ec,2)+"×"+fmt(em,2)+")＝"+fmt(P,1)+" kW\n実際の成績係数 (COP)R＝Φo／P＝"+phio+"／"+fmt(P,1)+"＝"+fmt(cop,2)
  };

}
/* combos for generated combo questions: correct + 4 distractors (sizes 2-3 preferred) */
function makeCombos(correct, n){
  var all=[]; for(var m=1;m<(1<<n);m++){ var idx=[]; for(var i=0;i<n;i++) if(m&(1<<i)) idx.push(i); all.push(idx); }
  var key=function(a){ return a.join(","); }, ck=key(correct);
  var pool = all.filter(function(a){ return key(a)!==ck && a.length>=2 && a.length<=3; });
  shuffle(pool);
  var opts = [correct].concat(pool.slice(0,4));
  opts.sort(function(a,b){ return a.length-b.length || key(a).localeCompare(key(b)); });
  return opts;
}
function findAns(q){ var ck = correctSet(q).join(","); for(var i=0;i<q.opts.length;i++) if(q.opts[i].join(",")===ck) return i; return -1; }

/* ---------- stats ---------- */
function record(q, correct){
  var r = store.q[q.id] || {seen:0, ok:0, lastWrong:false, subject:q.subject, slot:q.slot, levels:q.levels};
  r.seen++; if(correct) r.ok++; r.lastWrong = !correct; r.subject=q.subject; r.slot=q.slot; r.levels=q.levels; r.t=Date.now();
  store.q[q.id]=r; save();
}
function reviewPool(level){
  var out=[];
  poolFor(level,"law").concat(poolFor(level,"safety"), poolFor(level,"gakushiki")).forEach(function(q){
    var r = store.q[q.id]; if(r && r.lastWrong) out.push(q);
  });
  return out;
}

    var c = poolFor(level, subject, [t.no]); var sp = c.filter(function(q){ return q.levels.length===1; }); if(sp.length) c = sp; if(c.length) items.push(materialize(pick(c)));
  });
  S = {mode:"exam", level:level, subject:subject, items:items, idx:0, ans:items.map(function(){return -1;}), done:false, limit:cfg.min*60, start:Date.now(), finished:false};

function startTimer(){
  stopTimer();
  S.timer = setInterval(function(){
    var left = S.limit - Math.floor((Date.now()-S.start)/1000);
    var el = document.getElementById('timer');
    if(el){ el.textContent = mmss(left); el.className = 'timer' + (left<=300?' low':''); }
    if(left<=0){ finishExam(true); }
  }, 500);
}
function stopTimer(){ if(S && S.timer){ clearInterval(S.timer); S.timer=null; } }
function finishExam(auto){
  stopTimer();
  var ok=0;
  S.items.forEach(function(q,i){ var c = S.ans[i]===q.ans; if(c) ok++; record(q,c); });
  S.finished=true; S.score=ok; S.auto=!!auto; S.elapsed=Math.floor((Date.now()-S.start)/1000);
  store.history.unshift({t:Date.now(), level:S.level, subject:S.subject, score:ok, total:S.items.length, pass: ok>=Math.ceil(S.items.length*PASS)});
  store.history = store.history.slice(0,30); save();

}

    var topics = topicsFor(lv,s); if(!topics.length) return '';
    var bars = topics.map(function(t){
      var seen=0, ok=0;
      poolFor(lv,s,[t.no]).forEach(function(q){ var r=store.q[q.id]; if(r){ seen+=r.seen; ok+=r.ok; } });
      var pct = seen? Math.round(ok/seen*100) : null;
      var cls = pct===null? '' : (pct<60?' low': pct<80?' mid':'');
      return '<div class="bar"><span class="n">'+t.no+'</span><div class="track"><div class="fill'+cls+'" style="width:'+(pct||0)+'%"></div></div><span class="v">'+(pct===null?'—':pct+'%　'+ok+'/'+seen)+'</span><span class="name">'+esc(t.name)+'</span></div>';
    }).join('');
    return '<div class="card"><h2><span class="tag '+SUBJ[s].cls+'">'+SUBJ[s].name+'</span>　論点別の正答率</h2><p class="muted small">模擬試験・ドリル・復習の解答をすべて集計しています。</p><div class="bars" style="margin-top:10px">'+bars+'</div></div>';
  }).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>成績　<span class="muted small">'+esc(LEVELS[lv].short)+'</span></h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card"><h2>模擬試験の履歴</h2>'+(rows? '<table class="hist"><thead><tr><th>日時</th><th>科目</th><th>得点</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<p class="muted small" style="margin-top:6px">まだ模擬試験の記録がありません。</p>')+'</div>'+
    sections+
    '<div class="row"><button class="btn danger" data-action="reset">成績をすべて消す</button></div>'+
  '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-action]'); if(!b) return;
  var act = b.getAttribute('data-action');
  if(act==="level"){ var lv=b.getAttribute('data-level'); if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断して級を切り替えますか？')) return; stopTimer(); S=null; } store.level=lv; save(); drillSel=null; view={name:"home"}; render(); return; }
  if(act==="home"){ if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; drillSel=null; view={name:"home"}; render(); return; }
  if(act==="setup"){ drillSel=null; view={name:"setup", mode:b.getAttribute('data-mode')}; render(); return; }
  if(act==="exam"){ startExam(store.level, b.getAttribute('data-subject')); return; }
  if(act==="drillslots"){ drillSel=null; view={name:"drillslots", subject:b.getAttribute('data-subject')}; render(); return; }
  if(act==="chip"){ var s=+b.getAttribute('data-slot'); var k=drillSel.indexOf(s); if(k>=0) drillSel.splice(k,1); else drillSel.push(s); render(); return; }
  if(act==="chipall"){ drillSel = topicsFor(store.level, view.subject).map(function(t){return t.no;}); render(); return; }
  if(act==="chipnone"){ drillSel = []; render(); return; }
  if(act==="drillstart"){ startDrill(store.level, b.getAttribute('data-subject'), drillSel.slice()); return; }
  if(act==="review"){ startReview(store.level); return; }
  if(act==="stats"){ view={name:"stats"}; render(); return; }
  if(act==="reset"){ if(confirm('この端末に保存された成績と復習データをすべて消します。よろしいですか？')){ store.history=[]; store.q={}; save(); render(); } return; }
  if(act==="strike"){ if(!S) return; var si=+b.getAttribute('data-i'); var ss=strikeSet(); var p=ss.indexOf(si); if(p>=0) ss.splice(p,1); else ss.push(si); render(); return; }
  if(act==="choose"){
    var i=+b.getAttribute('data-i'); var q=S.items[S.idx];
    if(S.mode==="exam"){ S.ans[S.idx]=i; render(); return; }
    if(S.revealed[S.idx]) return;
    S.ans[S.idx]=i; S.revealed[S.idx]=true; record(q, i===q.ans); render(); return;
  }
  if(act==="prev"){ if(S.idx>0){ S.idx--; render(); } return; }
  if(act==="next"){ if(S.idx<S.items.length-1){ S.idx++; render(); } return; }
  if(act==="jump"){ S.idx=+b.getAttribute('data-i'); render(); return; }
  if(act==="finish"){ var un=S.ans.filter(function(a){return a<0;}).length; if(un && !confirm('未解答が '+un+' 問あります。採点しますか？')) return; finishExam(false); return; }
  if(act==="abort"){ if(S.mode==="exam"){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; view={name:"home"}; render(); return; }
  if(act==="drilldone"){ view={name:"drilldone"}; render(); return; }
  if(act==="toggle"){ var j=+b.getAttribute('data-i'); var d=document.getElementById('d'+j); var open=b.getAttribute('aria-expanded')==='true'; if(open){ d.hidden=true; d.innerHTML=''; b.setAttribute('aria-expanded','false'); } else { d.innerHTML=detailHTML(S.items[j], S.ans[j]); d.hidden=false; b.setAttribute('aria-expanded','true'); } return; }
});
document.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.getAttribute && e.target.getAttribute('data-action')==='strike'){ e.preventDefault(); e.target.click(); } });
window.addEventListener('beforeunload', function(e){ if(S && S.mode==="exam" && !S.finished){ e.preventDefault(); e.returnValue=''; } });

render();
})();
</script>
</body>
</html>
