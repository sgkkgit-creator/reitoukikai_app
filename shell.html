<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>冷凍機械責任者 試験対策</title>
<style>
:root{
  --paper:#F4F7F8; --card:#FFFFFF; --ink:#17242F; --muted:#5D6C78; --line:#D8E0E6; --line-strong:#B8C4CD;
  --teal:#0F6B7A; --teal-ink:#0B5460; --frost:#E3F0F2;
  --law:#24507A; --law-bg:#E7EEF6;
  --safety:#0F6B7A; --safety-bg:#E3F0F2;
  --gaku:#6A3F78; --gaku-bg:#F0E8F3;
  --ok:#2C7A4B; --ok-bg:#E4F2E9; --ng:#B3372D; --ng-bg:#F8E7E4; --warn:#B4741A; --warn-bg:#FBF1E0;
  --r:10px; --r-sm:6px;
  --fs:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-feature-settings:"palt";}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #2A8FA3;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);}
.top-in{max-width:720px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;line-height:1.2}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{max-width:720px;margin:0 auto;padding:16px 14px 48px}

/* generic */
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);font-weight:600}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:disabled{background:#9DB9BE;border-color:#9DB9BE;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal-ink)}
.btn.danger{color:var(--ng);border-color:#E3B9B4}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.block{width:100%}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;line-height:1.5}
.tag.law{background:var(--law-bg);color:var(--law)} .tag.safety{background:var(--safety-bg);color:var(--safety)} .tag.gaku{background:var(--gaku-bg);color:var(--gaku)}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-size:17px}
.tile span{color:var(--muted);font-size:13px}
.tile:hover{border-color:var(--teal)}
.hero{padding:6px 2px 2px}
.hero h1{font-size:24px}
.hero .lv{color:var(--teal-ink)}
.subjline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.subjline .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px}
.pill .dot{width:10px;height:10px;border-radius:50%}
.dot.law{background:var(--law)} .dot.safety{background:var(--safety)} .dot.gaku{background:var(--gaku)}

/* setup */
.opt-card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt-card[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.opt-card .t{font-weight:700}
.opt-card .d{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{display:inline-block;min-width:1.6em;color:inherit;opacity:.7;font-variant-numeric:tabular-nums}

/* question */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qbar .prog{font-variant-numeric:tabular-nums;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:var(--r-sm);background:var(--frost);color:var(--teal-ink)}
.timer.low{background:var(--ng-bg);color:var(--ng)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--teal)}
.qpaper{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qno{display:inline-block;background:var(--ink);color:#fff;font-weight:700;padding:2px 10px;border-radius:4px;font-size:15px;letter-spacing:.06em}
.qtopic{color:var(--muted);font-size:13px}
.stem{font-size:16px;line-height:1.75}
.figure{margin:14px 0 4px}
.figure svg{width:100%;height:auto;display:block}
.given{margin:12px 0 0;padding:10px 12px;background:var(--paper);border-radius:var(--r-sm);font-size:14px;line-height:1.7}
.given b{font-weight:600}
.stmts{list-style:none;margin:14px 0 0;padding:0}
.stmt{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stmt:last-child{border-bottom:1px solid var(--line)}
.kana{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1;margin-top:1px}
.stmt.ok .kana{background:var(--ok);border-color:var(--ok);color:#fff}
.stmt.ng .kana{background:var(--ng);border-color:var(--ng);color:#fff}
.stmt .t{line-height:1.7}
.stmt.can{cursor:pointer}
.stmt.struck .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ng);color:var(--muted)}
.stmt.struck .kana{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.hintnote{margin-top:8px;font-size:12px;color:var(--muted)}
.verdict{display:inline-block;font-weight:700;font-size:13px;margin-right:6px}
.stmt.ok .verdict{color:var(--ok)} .stmt.ng .verdict{color:var(--ng)}
.why{margin-top:6px;font-size:14px;line-height:1.65;color:#2F3D48;background:var(--paper);border-radius:var(--r-sm);padding:8px 10px}
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;min-height:48px;padding:8px 12px 8px 8px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card)}
.opt .num{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .lab{font-weight:600;letter-spacing:.04em}
.opt .mark{font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#F0F3F5}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
.opt.wrong .mark{color:var(--ng)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px;border-radius:var(--r-sm);background:var(--paper);font-size:14px;line-height:1.75}
.explain .line{font-variant-numeric:tabular-nums}
.result-line{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);font-weight:700}
.result-line.ok{background:var(--ok-bg);color:var(--ok)} .result-line.ng{background:var(--ng-bg);color:var(--ng)}
.nav{display:flex;gap:8px;margin-top:14px;justify-content:space-between;align-items:center}
.nav .btn{min-width:96px}
.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.sheet button{min-height:36px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.sheet button.answered{background:var(--frost);border-color:var(--teal)}
.sheet button.current{outline:2px solid var(--ink);outline-offset:-2px}

/* result */
.stamp-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stamp{width:112px;height:112px;border-radius:50%;border:4px double var(--ng);color:var(--ng);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:.12em;transform:rotate(-9deg);flex:none;padding-left:.12em}
.stamp.pass{border-color:var(--ok);color:var(--ok)}
.score{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:16px;font-weight:600;color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0}
.ritem{border-top:1px solid var(--line)}
.ritem:last-child{border-bottom:1px solid var(--line)}
.ritem>button{width:100%;text-align:left;background:transparent;border:0;padding:10px 4px;display:grid;grid-template-columns:44px 1fr 92px 20px;gap:8px;align-items:center}
.ritem .mk{font-weight:800}
.ritem .mk.ok{color:var(--ok)} .ritem .mk.ng{color:var(--ng)}
.ritem .an{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ritem .caret{color:var(--muted);text-align:right}
.ritem .detail{padding:0 4px 14px}

/* stats */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:32px 1fr 64px;gap:8px;align-items:center;font-size:14px}
.bar .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--teal);border-radius:6px}
.bar .fill.low{background:var(--ng)}
.bar .fill.mid{background:var(--warn)}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:13px}
.bar .name{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.hist th{color:var(--muted);font-weight:600;font-size:12px}
.hist td.num{text-align:right;font-variant-numeric:tabular-nums}
.pf{font-weight:700}
.pf.ok{color:var(--ok)} .pf.ng{color:var(--ng)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}
.notice{padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-bg);color:#6B4A0F;font-size:14px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">冷凍機械責任者 試験対策<small id="brand-sub"></small></div>
    <div class="seg" role="group" aria-label="受験級">
      <button type="button" data-action="level" data-level="3" aria-pressed="true">三冷</button>
      <button type="button" data-action="level" data-level="2" aria-pressed="false">二冷</button>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"></main>

<script id="qdata" type="application/json">/*__DATA__*/</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('qdata').textContent);
var LEVELS = {
  "3": {name:"第三種冷凍機械責任者", short:"三冷", subjects:["law","safety"]},
  "2": {name:"第二種冷凍機械責任者", short:"二冷", subjects:["law","safety","gakushiki"]}
};
var SUBJ = {law:{name:"法令", cls:"law"}, safety:{name:"保安管理技術", cls:"safety"}, gakushiki:{name:"学識", cls:"gaku"}};
var EXAM = {"3":{law:{n:20,min:60}, safety:{n:15,min:90}}, "2":{law:{n:20,min:60}, safety:{n:10,min:90}, gakushiki:{n:10,min:120}}};
var KANA = ["イ","ロ","ハ","ニ","ホ"];
var PASS = 0.6;
var KEY = "reito_exam_app_v1";

/* ---------- storage ---------- */
function loadStore(){ try{ var s = JSON.parse(localStorage.getItem(KEY)); return (s && typeof s==='object') ? s : {}; }catch(e){ return {}; } }
var store = loadStore();
if(!store.level) store.level = "3";
if(!store.history) store.history = [];
if(!store.q) store.q = {};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rnd(a,b,step){ var n=Math.round((b-a)/step); return +(a+step*Math.floor(Math.random()*(n+1))).toFixed(6); }
function fmt(v,d){ return Number(v).toFixed(d); }
function pad(n){ return (n<10?"0":"")+n; }
function mmss(sec){ sec=Math.max(0,sec); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
function zen(n){ return String(n).replace(/[0-9]/g, function(d){ return "０１２３４５６７８９"[+d]; }); }
function comboLabel(idx){ return idx.map(function(i){ return KANA[i]; }).join("、"); }
function topicsFor(level, subject){ return (DATA.topics[level] && DATA.topics[level][subject]) || []; }
function topicName(level, subject, slot){ var t = topicsFor(level, subject).filter(function(x){ return x.no===slot; })[0]; return t ? t.name : ""; }

/* ---------- question pool ---------- */
function poolFor(level, subject, slots){
  var out = [];
  DATA.questions.forEach(function(q){
    if(q.subject===subject && q.levels.indexOf(level)>=0 && (!slots || slots.indexOf(q.slot)>=0)) out.push(q);
  });
  topicsFor(level, subject).forEach(function(t){
    if(t.gen && (!slots || slots.indexOf(t.no)>=0)) out.push({gen:t.gen, slot:t.no, subject:subject, id:"G-"+t.gen, levels:[level]});
  });
  return out;
}
function slotsCovered(level, subject){
  var covered = {};
  poolFor(level, subject).forEach(function(q){ covered[q.slot]=true; });
  return Object.keys(covered).length;
}
function materialize(q){ /* generator descriptor -> concrete question */
  if(!q.gen) return q;
  if(q.gen==="ph") return genPH();
  if(q.gen==="vcop") return genVCOP();
  return q;
}
function isCombo(q){ return !!q.statements; }
function correctSet(q){ var s=[]; q.statements.forEach(function(st,i){ if(st.ok) s.push(i); }); return s; }

/* ---------- generators (二冷 学識 計算) ---------- */
function genPH(){
  var hf = rnd(150,210,1), h4 = rnd(hf+60, hf+110, 1), hg = rnd(340,365,1), h1 = hg + rnd(0,20,1), h2 = h1 + rnd(40,70,1), qmr = rnd(0.5,3.0,0.1);
  var phio = qmr*(h1-h4), jrt = phio/3.86, phik = qmr*(h2-h4), P = qmr*(h2-h1), cop = (h1-h4)/(h2-h1), x4 = (h4-hf)/(hg-hf);
  var wrong = {
    jrt: [qmr*(hg-h4)/3.86, phik/3.86, qmr*(h2-h1)/3.86],
    phik: [phio, qmr*(h2-hg), qmr*(h2-h1)],
    cop: [(h2-h4)/(h2-h1), (h1-h4)/(h2-h4), (hg-h4)/(h2-h1)],
    x4: [(h4-hf)/(h1-hf), 1-x4, (hg-h4)/(hg-hf)]
  };
  function far(cands, truth){ var c = cands.filter(function(v){ return Math.abs(v-truth)/Math.abs(truth) > 0.15; }); return c.length? pick(c) : truth*1.3; }
  var nTrue = pick([1,2,2,3,3]);
  var mask = shuffle([true,true,true,true].map(function(_,i){ return i<nTrue; }));
  var texts = [
    function(ok){ var v = ok? jrt : far(wrong.jrt, jrt); return {t:"冷凍能力は約 "+fmt(v,1)+" 日本冷凍トンである。", why:"Φo＝qmr(h1−h4)＝"+fmt(qmr,1)+"×("+h1+"−"+h4+")＝"+fmt(phio,1)+" kW。3.86 kW/JRt で除して "+fmt(jrt,1)+" JRt。"}; },
    function(ok){ var v = ok? phik : far(wrong.phik, phik); return {t:"凝縮器の凝縮負荷は約 "+fmt(v,0)+" kW である。", why:"Φk＝qmr(h2−h4)＝"+fmt(qmr,1)+"×("+h2+"−"+h4+")＝"+fmt(phik,0)+" kW。凝縮負荷は冷凍能力と圧縮動力の和になる。"}; },
    function(ok){ var v = ok? cop : far(wrong.cop, cop); return {t:"理論冷凍サイクルの成績係数は約 "+fmt(v,2)+" である。", why:"(COP)R＝(h1−h4)／(h2−h1)＝("+h1+"−"+h4+")／("+h2+"−"+h1+")＝"+fmt(cop,2)+"。"}; },
    function(ok){ var v = ok? x4 : far(wrong.x4, x4); return {t:"蒸発器入口（膨張弁出口）の冷媒の乾き度は約 "+fmt(v,2)+" である。", why:"乾き度 x4＝(h4−h飽和液)／(h飽和蒸気−h飽和液)＝("+h4+"−"+hf+")／("+hg+"−"+hf+")＝"+fmt(x4,2)+"。"}; }
  ];
  var statements = texts.map(function(fn,i){ var r = fn(mask[i]); return {k:KANA[i], t:r.t, ok:mask[i], why:(mask[i]?"正しい。":"誤り。")+r.why}; });
  var q = {
    id:"G-ph", gen:"ph", subject:"gakushiki", slot:1, levels:["2"],
    stem:"冷媒循環量 qmr＝"+fmt(qmr,1)+" kg/s で運転されている理論冷凍サイクルの各点の比エンタルピー h（kJ/kg）は、図に示す値である。次のイ、ロ、ハ、ニの記述のうち、正しいものはどれか。ただし、1日本冷凍トンは 3.86 kW とする。",
    figure: phSvg(hf,h4,hg,h1,h2),
    given: "圧縮機吸込み蒸気 h1＝"+h1+"、圧縮機吐出しガス h2＝"+h2+"、凝縮器出口液（膨張弁入口）h3＝h4＝"+h4+"、蒸発圧力における飽和液 "+hf+"、飽和蒸気 "+hg+"（単位 kJ/kg）",
    statements: statements
  };
  q.opts = makeCombos(correctSet(q), 4);
  q.ans = findAns(q);
  return q;
}
function phSvg(hf,h4,hg,h1,h2){
  var pts = {hf:[92,168], h4:[128,168], hg:[292,168], h1:[318,168], h3:[112,96], h2:[336,96]};
  function pt(p,lbl,dx,dy,above){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#17242F"/><text x="'+(p[0]+dx)+'" y="'+(p[1]+dy)+'" font-size="12" font-weight="700" fill="#17242F">'+lbl+'</text>'; }
  return '<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="p-h線図"><rect width="380" height="240" fill="#FFFFFF"/>'+
  '<path d="M60 206 C 90 70, 300 70, 340 206" fill="none" stroke="#7A8A96" stroke-width="1.5"/>'+
  '<line x1="40" y1="206" x2="366" y2="206" stroke="#17242F" stroke-width="1.5"/><line x1="40" y1="206" x2="40" y2="30" stroke="#17242F" stroke-width="1.5"/>'+
  '<text x="366" y="200" font-size="12" fill="#5D6C78">h</text><text x="26" y="42" font-size="12" fill="#5D6C78">p</text>'+
  '<line x1="112" y1="96" x2="336" y2="96" stroke="#0F6B7A" stroke-width="2"/>'+
  '<line x1="128" y1="168" x2="318" y2="168" stroke="#0F6B7A" stroke-width="2"/>'+

function genVCOP(){
  var phio = rnd(100,400,10), v1 = rnd(0.040,0.090,0.001), h1 = rnd(350,375,1), h2 = h1 + rnd(35,55,1), h4 = rnd(230,270,1);
  var ev = rnd(0.65,0.80,0.01), ec = rnd(0.70,0.85,0.01), em = rnd(0.85,0.95,0.01);
  var qmr = phio/(h1-h4), V = qmr*v1*3600/ev, Pth = qmr*(h2-h1), P = Pth/(ec*em), cop = phio/P;
  var Va = qmr*v1*3600, Vb = qmr*v1*3600*ev, copa = phio/(Pth/ec), copb = phio/Pth;
  var pairs = [[V,cop],[V,copa],[Va,cop],[Va,copb],[Vb,copa]];
  var seen = {}; pairs = pairs.filter(function(p){ var k=fmt(p[0],0)+"/"+fmt(p[1],2); if(seen[k]) return false; seen[k]=true; return true; });
  while(pairs.length<5){ pairs.push([V*(1+0.1*pairs.length), cop*(1-0.07*pairs.length)]); }
  pairs.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  var ansIdx = pairs.findIndex(function(p){ return p[0]===V && p[1]===cop; });
  var q = {
    id:"G-vcop", gen:"vcop", subject:"gakushiki", slot:2, levels:["2"],
    stem:"冷凍能力 Φo＝"+phio+" kW の往復圧縮機を用いた冷凍装置が、下記の条件で運転されている。この圧縮機のピストン押しのけ量 V（m³/h）と、この装置の実際の成績係数（COP）R の値の組合せとして、最も近いものはどれか。ただし、機械的摩擦損失仕事は冷媒に熱として加わらないものとする。",
    given: "圧縮機吸込み蒸気の比体積 v1＝"+fmt(v1,3)+" m³/kg、比エンタルピー h1＝"+h1+" kJ/kg／圧縮機吐出しガスの比エンタルピー（断熱圧縮後）h2＝"+h2+" kJ/kg／蒸発器入口の冷媒の比エンタルピー h4＝"+h4+" kJ/kg／体積効率 ηv＝"+fmt(ev,2)+"／断熱効率 ηc＝"+fmt(ec,2)+"／機械効率 ηm＝"+fmt(em,2),
    opts: pairs.map(function(p){ return "V＝"+fmt(p[0],0)+" m³/h、(COP)R＝"+fmt(p[1],2); }),
    ans: ansIdx,
    explain: "冷媒循環量 qmr＝Φo／(h1−h4)＝"+phio+"／("+h1+"−"+h4+")＝"+fmt(qmr,3)+" kg/s\nピストン押しのけ量 V＝qmr・v1×3600／ηv＝"+fmt(qmr,3)+"×"+fmt(v1,3)+"×3600／"+fmt(ev,2)+"＝"+fmt(V,0)+" m³/h\n理論断熱圧縮動力 Pth＝qmr(h2−h1)＝"+fmt(Pth,1)+" kW\n実際の軸動力 P＝Pth／(ηc・ηm)＝"+fmt(Pth,1)+"／("+fmt(ec,2)+"×"+fmt(em,2)+")＝"+fmt(P,1)+" kW\n実際の成績係数 (COP)R＝Φo／P＝"+phio+"／"+fmt(P,1)+"＝"+fmt(cop,2)
  };
  return q;
}
/* combos for generated combo questions: correct + 4 distractors (sizes 2-3 preferred) */
function makeCombos(correct, n){
  var all=[]; for(var m=1;m<(1<<n);m++){ var idx=[]; for(var i=0;i<n;i++) if(m&(1<<i)) idx.push(i); all.push(idx); }
  var key=function(a){ return a.join(","); }, ck=key(correct);
  var pool = all.filter(function(a){ return key(a)!==ck && a.length>=2 && a.length<=3; });
  shuffle(pool);
  var opts = [correct].concat(pool.slice(0,4));
  opts.sort(function(a,b){ return a.length-b.length || key(a).localeCompare(key(b)); });
  return opts;
}
function findAns(q){ var ck = correctSet(q).join(","); for(var i=0;i<q.opts.length;i++) if(q.opts[i].join(",")===ck) return i; return -1; }

function record(q, correct){
  var r = store.q[q.id] || {seen:0, ok:0, lastWrong:false, subject:q.subject, slot:q.slot, levels:q.levels};
  r.seen++; if(correct) r.ok++; r.lastWrong = !correct; r.subject=q.subject; r.slot=q.slot; r.levels=q.levels; r.t=Date.now();
  store.q[q.id]=r; save();
}
function reviewPool(level){
  var out=[];
  poolFor(level,"law").concat(poolFor(level,"safety"), poolFor(level,"gakushiki")).forEach(function(q){
    var r = store.q[q.id]; if(r && r.lastWrong) out.push(q);
  });
  return out;
}

  stopTimer();

function finishExam(auto){

  S.items.forEach(function(q,i){ var c = S.ans[i]===q.ans; if(c) ok++; record(q,c); });
  S.finished=true; S.score=ok; S.auto=!!auto; S.elapsed=Math.floor((Date.now()-S.start)/1000);
  store.history.unshift({t:Date.now(), level:S.level, subject:S.subject, score:ok, total:S.items.length, pass: ok>=Math.ceil(S.items.length*PASS)});

function detailHTML(q, chosen){
  return '<div class="qpaper">'+(q.case&&DATA.cases&&DATA.cases[q.case]? '<div class="given" style="margin:0 0 10px">'+esc(DATA.cases[q.case])+'</div>':'')+'<p class="stem small">'+esc(q.stem)+'</p>'+(q.figure? '<div class="figure">'+q.figure+'</div>':'')+(q.given? '<div class="given">'+esc(q.given)+'</div>':'')+
    (isCombo(q)? '<ol class="stmts">'+q.statements.map(function(_,k){ return statementHTML(q,k,true); }).join('')+'</ol>':'')+
    optionsHTML(q, chosen, true, true)+
    (q.explain? '<div class="explain">'+q.explain.split("\n").map(function(l){return '<div class="line">'+esc(l)+'</div>';}).join('')+'</div>':'')+'</div>';
}
function renderDrillDone(){
  var n=S.items.length, ok=S.items.filter(function(q,i){return S.ans[i]===q.ans;}).length;
  var wrong = S.items.map(function(q,i){ return S.ans[i]===q.ans? null : '<li class="ritem"><button data-action="toggle" data-i="'+i+'" aria-expanded="false"><span class="mk ng">×</span><span>問'+q.slot+'　'+esc(topicName(S.level,q.subject,q.slot))+'</span><span class="an">('+(S.ans[i]+1)+') → ('+(q.ans+1)+')</span><span class="caret">›</span></button><div class="detail" id="d'+i+'" hidden></div></li>'; }).filter(Boolean).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>'+(S.mode==="review"?'復習':'ドリル')+'の結果</h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card"><div class="score">'+ok+'<small>／'+n+'問　'+(n?Math.round(ok/n*100):0)+'%</small></div></div>'+
    (wrong? '<div class="card"><h2>間違えた問題</h2><ul class="rlist">'+wrong+'</ul></div>' : '<div class="empty">全問正解です。</div>')+
    '<div class="row">'+(S.mode==="review"? '<button class="btn primary" data-action="review">もう一度復習</button>' : '<button class="btn primary" data-action="drillslots" data-subject="'+S.subject+'">論点を選び直す</button>')+'</div>'+
  '</div>';
}
function renderStats(){
  var lv = store.level;
  var hist = store.history.filter(function(h){return h.level===lv;}).slice(0,20);
  var rows = hist.map(function(h){ var d=new Date(h.t); return '<tr><td>'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</td><td><span class="tag '+SUBJ[h.subject].cls+'">'+SUBJ[h.subject].name+'</span></td><td class="num">'+h.score+'／'+h.total+'</td><td class="pf '+(h.pass?'ok':'ng')+'">'+(h.pass?'合格':'不合格')+'</td></tr>'; }).join('');
  var sections = LEVELS[lv].subjects.map(function(s){
    var topics = topicsFor(lv,s); if(!topics.length) return '';
    var bars = topics.map(function(t){
      var seen=0, ok=0;
      poolFor(lv,s,[t.no]).forEach(function(q){ var r=store.q[q.id]; if(r){ seen+=r.seen; ok+=r.ok; } });
      var pct = seen? Math.round(ok/seen*100) : null;
      var cls = pct===null? '' : (pct<60?' low': pct<80?' mid':'');
      return '<div class="bar"><span class="n">'+t.no+'</span><div class="track"><div class="fill'+cls+'" style="width:'+(pct||0)+'%"></div></div><span class="v">'+(pct===null?'—':pct+'%　'+ok+'/'+seen)+'</span><span class="name">'+esc(t.name)+'</span></div>';
    }).join('');
    return '<div class="card"><h2><span class="tag '+SUBJ[s].cls+'">'+SUBJ[s].name+'</span>　論点別の正答率</h2><p class="muted small">模擬試験・ドリル・復習の解答をすべて集計しています。</p><div class="bars" style="margin-top:10px">'+bars+'</div></div>';
  }).join('');
  return '<div class="stack">'+
    '<div class="spread"><h1>成績　<span class="muted small">'+esc(LEVELS[lv].short)+'</span></h1><button class="btn ghost" data-action="home">ホーム</button></div>'+
    '<div class="card"><h2>模擬試験の履歴</h2>'+(rows? '<table class="hist"><thead><tr><th>日時</th><th>科目</th><th>得点</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table>' : '<p class="muted small" style="margin-top:6px">まだ模擬試験の記録がありません。</p>')+'</div>'+
    sections+
    '<div class="row"><button class="btn danger" data-action="reset">成績をすべて消す</button></div>'+
  '</div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-action]'); if(!b) return;
  var act = b.getAttribute('data-action');
  if(act==="level"){ var lv=b.getAttribute('data-level'); if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断して級を切り替えますか？')) return; stopTimer(); S=null; } store.level=lv; save(); drillSel=null; view={name:"home"}; render(); return; }
  if(act==="home"){ if(S && S.mode==="exam" && !S.finished){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; drillSel=null; view={name:"home"}; render(); return; }
  if(act==="setup"){ drillSel=null; view={name:"setup", mode:b.getAttribute('data-mode')}; render(); return; }
  if(act==="exam"){ startExam(store.level, b.getAttribute('data-subject')); return; }
  if(act==="drillslots"){ drillSel=null; view={name:"drillslots", subject:b.getAttribute('data-subject')}; render(); return; }
  if(act==="chip"){ var s=+b.getAttribute('data-slot'); var k=drillSel.indexOf(s); if(k>=0) drillSel.splice(k,1); else drillSel.push(s); render(); return; }
  if(act==="chipall"){ drillSel = topicsFor(store.level, view.subject).map(function(t){return t.no;}); render(); return; }
  if(act==="chipnone"){ drillSel = []; render(); return; }
  if(act==="drillstart"){ startDrill(store.level, b.getAttribute('data-subject'), drillSel.slice()); return; }
  if(act==="review"){ startReview(store.level); return; }
  if(act==="stats"){ view={name:"stats"}; render(); return; }
  if(act==="reset"){ if(confirm('この端末に保存された成績と復習データをすべて消します。よろしいですか？')){ store.history=[]; store.q={}; save(); render(); } return; }
  if(act==="strike"){ if(!S) return; var si=+b.getAttribute('data-i'); var ss=strikeSet(); var p=ss.indexOf(si); if(p>=0) ss.splice(p,1); else ss.push(si); render(); return; }
  if(act==="choose"){
    var i=+b.getAttribute('data-i'); var q=S.items[S.idx];
    if(S.mode==="exam"){ S.ans[S.idx]=i; render(); return; }
    if(S.revealed[S.idx]) return;
    S.ans[S.idx]=i; S.revealed[S.idx]=true; record(q, i===q.ans); render(); return;
  }
  if(act==="prev"){ if(S.idx>0){ S.idx--; render(); } return; }
  if(act==="next"){ if(S.idx<S.items.length-1){ S.idx++; render(); } return; }
  if(act==="jump"){ S.idx=+b.getAttribute('data-i'); render(); return; }
  if(act==="finish"){ var un=S.ans.filter(function(a){return a<0;}).length; if(un && !confirm('未解答が '+un+' 問あります。採点しますか？')) return; finishExam(false); return; }
  if(act==="abort"){ if(S.mode==="exam"){ if(!confirm('模擬試験を中断しますか？採点されません。')) return; stopTimer(); } S=null; view={name:"home"}; render(); return; }
  if(act==="drilldone"){ view={name:"drilldone"}; render(); return; }
  if(act==="toggle"){ var j=+b.getAttribute('data-i'); var d=document.getElementById('d'+j); var open=b.getAttribute('aria-expanded')==='true'; if(open){ d.hidden=true; d.innerHTML=''; b.setAttribute('aria-expanded','false'); } else { d.innerHTML=detailHTML(S.items[j], S.ans[j]); d.hidden=false; b.setAttribute('aria-expanded','true'); } return; }
});
document.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.getAttribute && e.target.getAttribute('data-action')==='strike'){ e.preventDefault(); e.target.click(); } });
window.addEventListener('beforeunload', function(e){ if(S && S.mode==="exam" && !S.finished){ e.preventDefault(); e.returnValue=''; } });

render();
})();
</script>
</body>
</html>
